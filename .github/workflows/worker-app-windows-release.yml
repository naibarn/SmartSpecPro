name: Worker App Windows Release
run-name: Worker App Windows ${{ inputs.release_version || 'next' }} · ${{ inputs.build_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Worker App version (leave empty to use the next patch version)"
        required: false
        type: string
      release_notes:
        description: "Optional release notes shown in the Dashboard"
        required: false
        type: string
      build_id:
        description: "Build correlation ID from the Dashboard"
        required: false
        type: string
      source_sha:
        description: "Exact main commit selected by the Dashboard"
        required: false
        type: string
      publish_direct:
        description: "Publish directly through the legacy upload endpoint"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  build-windows-worker-app:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Verify Windows x64 host
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") { throw "Worker App must be built on Windows x64" }
          if ((node -p "process.platform") -ne "win32") { throw "Node is not running on Windows" }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Worker App installer
        id: build
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SMARTAIHUB_PUBLIC_URL: https://smartaihub.app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RELEASE_VERSION) {
            npm --workspace apps/worker-app run release:windows -- --release-version $env:RELEASE_VERSION --skip-frontend-typecheck --runtime-from-server
          } else {
            npm --workspace apps/worker-app run release:windows -- --skip-frontend-typecheck --runtime-from-server
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = node -p "require('./apps/worker-app/package.json').version"
          "release_version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify installer artifact
        id: verify
        env:
          RELEASE_VERSION: ${{ steps.build.outputs.release_version }}
          BUILD_ID: ${{ inputs.build_id }}
        shell: pwsh
        run: |
          $installerPath = "apps/web/client/public/releases/smart-ai-hub-worker-app-$env:RELEASE_VERSION-x64-setup.exe"
          if (-not (Test-Path $installerPath)) { throw "Expected installer was not produced: $installerPath" }
          $bytes = [System.IO.File]::ReadAllBytes($installerPath)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw "Worker App installer is not a Windows PE executable" }
          Get-FileHash $installerPath -Algorithm SHA256
          $item = Get-Item $installerPath
          $manifest = [ordered]@{
            product = 'smart-ai-hub-worker-app'
            platform = 'windows-x64'
            version = $env:RELEASE_VERSION
            fileName = $item.Name
            sizeBytes = $item.Length
            sha256 = (Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
            sourceCommit = (git rev-parse HEAD)
            workflowRunId = $env:GITHUB_RUN_ID
            buildId = $env:BUILD_ID
          }
          $manifest | ConvertTo-Json -Compress | Set-Content -Encoding utf8 apps/web/client/public/releases/worker-release-manifest.json

      - name: Preserve installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-ai-hub-worker-app-windows-x64
          path: |
            apps/web/client/public/releases/smart-ai-hub-worker-app-${{ steps.build.outputs.release_version }}-x64-setup.exe
            apps/web/client/public/releases/worker-release-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish installer to Dashboard
        if: inputs.publish_direct == true
        env:
          RELEASE_VERSION: ${{ steps.build.outputs.release_version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          SMARTAIHUB_PUBLIC_URL: https://smartaihub.app
        run: node scripts/publish-worker-app-windows-release.mjs

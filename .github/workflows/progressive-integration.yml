name: Progressive Integration Checks

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  progressive_integration_gate:
    name: progressive_integration_gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run lifecycle tests for affected skill changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-paths.txt"
          SCOPE_RESULT="$(python scripts/development-lifecycle/progressive_gate_scope.py "$RUNNER_TEMP/changed-paths.txt")"
          case "$SCOPE_RESULT" in
            run) ;;
            skip)
              echo "No progressive-integration policy changes; gate is not applicable."
              exit 0
              ;;
            *)
              echo "Unable to classify changed paths; failing closed."
              exit 1
              ;;
          esac
          python -m unittest \
            scripts.development-lifecycle.test_canonical_source \
            scripts.development-lifecycle.test_progressive_integration \
            scripts.development-lifecycle.test_deep_workflow_alignment \
            scripts.development-lifecycle.test_progressive_gate_scope \
            scripts.development-lifecycle.test_migration_attempt_serialization \
            scripts.development-lifecycle.test_migration_workflow_contract
          python -m unittest scripts.development-lifecycle.test_workspace_authority
          python -m unittest discover \
            -s skills/integration-controller/tests \
            -p 'test_*.py'
          # Block a future regression of optional-gate recovery and fresh builds.
          python -m unittest discover \
            -s skills/orchestra/tests \
            -p 'test_lifecycle_policy.py'
          python -m unittest discover \
            -s scripts/development-lifecycle \
            -p 'test_canonical_build_retry.py'
          python -m unittest discover \
            -s apps/web/scripts \
            -p 'test_build_main_deploy_freshness.py'

permissions:
  contents: read

jobs:
  local-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install scoped Python connector verification dependencies
        run: python -m pip install pydantic-settings==2.12.0 structlog==25.5.0 asyncpg==0.31.0 pytest==7.4.4 pytest-asyncio==0.23.3
      - name: Test isolated artifact publisher configuration discovery
        run: python3 -m unittest discover -s scripts/development-lifecycle -p test_cloudflare_artifact_environment.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Guard standalone Linux runtime import boundaries
        run: node --test apps/web/scripts/verify-linux-runtime-dependencies.test.mjs
      - name: Verify production Worker transport remains scoped and disabled by default
        run: node --test apps/cloudflare/wrangler.production.config.test.mjs
      - name: Verify canonical on-demand HTTP image preparation
        run: |
          python3 -m unittest discover -s apps/web/scripts -p 'test_package_cloudflare*http_image.py'
          DEBUG=false PYTHONPATH=python-backend python -m unittest discover -s python-backend/scripts -p test_cloudflare_http_entrypoint.py
          python -m unittest discover -s python-backend/scripts -p test_application_import_boundaries.py
          python3 -m unittest discover -s apps/web/scripts -p test_build_cloudflare_http_image.py
          PYTHONPATH=python-backend python -m unittest discover -s python-backend/scripts -p test_cloudflare_http_image_contract.py
          DEBUG=false PYTHONPATH=python-backend python -m pytest --noconftest python-backend/tests/unit/test_production_api_startup.py -q -o addopts=
          node --test apps/web/scripts/cloudflare-http-entrypoint.test.mjs
      - name: Verify Linux release permissions and recovery
        run: python3 -m unittest discover -s apps/web/scripts -p test_linux_backend_release.py
      - name: Verify tenant branding and desktop bearer authorization
        run: pnpm --filter @smartspec/web exec vitest run server/services/__tests__/managedStorageAuthorizationService.test.ts server/_core/__tests__/authz.mcpOAuth.test.ts
        env:
          JWT_SECRET: ci-tenant-branding-fixture-key-not-a-secret
      - name: Test Express route architecture guard
        run: node --test scripts/guards/express-route-architecture.test.mjs
      - name: Enforce Hono-first Express route policy
        env:
          GUARD_BASE: ${{ github.event.pull_request.base.ref && format('origin/{0}', github.event.pull_request.base.ref) || github.event.before }}
        run: |
          guard_base="$GUARD_BASE"
          if ! git cat-file -e "${guard_base}^{commit}" 2>/dev/null; then
            guard_base=origin/main
          fi
          node scripts/guards/express-route-architecture.mjs --base="$guard_base"
      - name: Compile Cloudflare runtime package
        run: npm --workspace @smartspec/cloudflare-runtime run check
      - name: Bundle Cloudflare Worker with Wrangler
        run: pnpm dlx wrangler@4.151.1 deploy --config apps/cloudflare/wrangler.jsonc --dry-run --outdir /tmp/smartspec-cloudflare-worker-build
      - name: Build shared Remotion schema package
        run: pnpm --filter @smartspec/remotion-render run build
      - name: Build Vite SPA for staging assets
        run: pnpm --filter @smartspec/web exec vite build --configLoader runner
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Bundle staging Worker and static assets
        run: pnpm dlx wrangler@4.151.1 deploy --config apps/cloudflare/wrangler.staging.jsonc --dry-run --outdir /tmp/smartspec-cloudflare-staging-build
      - name: Guard staging config isolation
        run: node --test apps/cloudflare/wrangler.staging.config.test.mjs
      - name: Test canonical staging artifact packager
        run: node --test apps/cloudflare/scripts/package-staging-artifact.test.mjs
      - name: Test protected-origin WebSocket pair and Access cookie isolation in workerd
        run: node --test apps/cloudflare/scripts/protected-origin-websocket-runtime.test.mjs
      - name: Smoke test Cloudflare Worker in local workerd
        run: |
          set -euo pipefail
          pnpm dlx wrangler@4.151.1 dev --config apps/cloudflare/wrangler.jsonc --local --port 8799 > "$RUNNER_TEMP/wrangler-hono.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8799/healthz >/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = "true"
          curl -fsS http://127.0.0.1:8799/.well-known/smartaihub-evidence-keys.json | jq -e '.format == "sah-evidence-keys-v1" and .keys == []'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -I http://127.0.0.1:8799/.well-known/smartaihub-evidence-keys.json)" = "200"
          etag=$(curl -sSI http://127.0.0.1:8799/.well-known/smartaihub-evidence-keys.json | awk 'tolower($1) == "etag:" { gsub("\r", ""); print $2 }')
          test -n "$etag"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H "If-None-Match: $etag" http://127.0.0.1:8799/.well-known/smartaihub-evidence-keys.json)" = "304"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/api/auth/session)" = "503"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/native-unknown)" = "501"
      - name: Smoke test staging SPA and API routing in local workerd
        run: |
          set -euo pipefail
          pnpm dlx wrangler@4.151.1 dev --config apps/cloudflare/wrangler.staging.jsonc --local --port 8800 > "$RUNNER_TEMP/wrangler-staging.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 45); do
            if curl -fsS -H 'Sec-Fetch-Mode: navigate' -H 'Sec-Fetch-Dest: document' -H 'Accept: text/html' http://127.0.0.1:8800/ >/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = "true"
          curl -fsS -H 'Sec-Fetch-Mode: navigate' -H 'Sec-Fetch-Dest: document' -H 'Accept: text/html' http://127.0.0.1:8800/app/chat | grep -q '<div id="root">'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Sec-Fetch-Mode: navigate' -H 'Sec-Fetch-Dest: document' -H 'Accept: text/html' http://127.0.0.1:8800/api/unknown)" = "503"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8800/api/auth/session)" = "503"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8800/healthz)" = "200"
          curl -fsS http://127.0.0.1:8800/.well-known/smartaihub-evidence-keys.json | jq -e '.format == "sah-evidence-keys-v1" and .keys == []'
          asset_path=$(curl -fsS http://127.0.0.1:8800/ | grep -oE '/assets/[^" ]+\.(js|css)' | head -n 1)
          test -n "$asset_path"
          cache_control=$(curl -sSI "http://127.0.0.1:8800$asset_path" | awk 'tolower($1) == "cache-control:" { gsub("\r", ""); print tolower($0) }')
          printf '%s\n' "$cache_control" | grep -q 'max-age=31536000'
          printf '%s\n' "$cache_control" | grep -q 'immutable'
          test "$(curl -sSI http://127.0.0.1:8800/ | awk 'tolower($1) == "cache-control:" { gsub("\r", ""); print tolower($0) }' | grep -c 'no-cache')" -ge 1
      - name: Run Cloudflare runtime contract tests
        run: npm --workspace @smartspec/cloudflare-runtime test
      - name: Verify application HTTP ownership and database trust policy
        run: pnpm --filter @smartspec/web exec vitest run server/_core/applicationRuntime.test.ts server/_core/sharedProductionDebug.test.ts server/_core/applicationDatabaseTls.test.ts server/services/skillRegistry.requestRuntime.test.ts server/services/appRuntimeConfig.requestRuntime.test.ts server/services/cloudflareHttpImageProvisionContract.test.ts
      - name: Verify session cookies on staging and production hostnames
        run: pnpm --filter @smartspec/web exec vitest run server/__tests__/auth-cookies.test.ts server/__tests__/cloudflare-origin-attestation.test.ts server/__tests__/cloudflare-origin-middleware.test.ts server/__tests__/cloudflare-origin-upgrade.test.ts server/__tests__/cloudflare-public-origin.test.ts server/__tests__/csrf-protection.test.ts server/__tests__/csrf-middleware.test.ts
      - name: Verify OAuth readiness and callbacks on verified public origins
        run: pnpm --filter @smartspec/web exec vitest run server/services/oauthProviderAvailability.test.ts server/_core/oauthProxy.test.ts server/services/pendingTwoFactor.test.ts server/routers/systemSettings.googleOAuth.test.ts client/src/pages/AdminSettings.componentBindings.test.ts
      - name: Verify paused macOS rendering distribution and retained active platforms
        run: pnpm --filter @smartspec/web exec vitest run --maxWorkers=1 --testTimeout=15000 server/services/workerRuntimeReleaseService.test.ts server/routes/__tests__/workerRuntime.test.ts server/routes/__tests__/workerRuntimeReleases.test.ts client/src/features/desktop-releases/__tests__/DesktopReleasePanel.test.tsx client/src/components/settings/__tests__/ConnectedDevicesPanel.test.tsx
      - name: Run web adapter contract tests
        run: npm --workspace @smartspec/web run test -- server/services/__tests__/feature186RuntimeAdapter.test.ts server/routes/jobControlPlane.cloudflare.test.ts server/services/__tests__/cloudflareJobAdapters.test.ts server/services/__tests__/registeredWorkerAppBinding.test.ts server/services/__tests__/cloudflareWorkflowHttpAdapter.test.ts server/services/cloudflareOriginVersionBindings.test.ts server/routes/spec260EvidenceRetentionSchedule.test.ts server/services/cloudflareOriginProvisionTransport.test.ts server/services/cloudflareOriginProvisionExecutor.test.ts server/services/cloudflareNativeProvisionTransport.test.ts server/services/cloudflareNativeProvisionExecutor.test.ts server/services/cloudflareHttpImageProvisionContract.test.ts server/services/cloudflareHttpImagePublication.test.ts server/services/cloudflareHttpApplicationBindings.test.ts server/services/cloudflareHttpApplicationProvision.test.ts server/services/cloudflareHttpImageBuildOperator.test.ts server/services/cloudflareHttpImageProvisionExecutor.test.ts server/services/__tests__/jobTransportAdapters.test.ts server/services/cloudflarePrivateDatabase.test.ts server/services/cloudflareNativeBindingDescriptor.test.ts server/services/cloudflareStagingApiTransport.test.ts server/services/cloudflareStagingAssetMetadata.test.ts server/services/cloudflareStagingLeaseHeartbeat.test.ts server/services/cloudflareStagingDeploymentExecutor.test.ts server/services/__tests__/jobControlPlane.test.ts server/services/__tests__/workerJobMonitorService.test.ts server/services/__tests__/cloudflareStagingExecutorIdentityService.test.ts server/services/cloudflareStagingArtifactAuthority.test.ts server/routes/__tests__/contentProtectionPublicKeys.test.ts server/routers/infrastructure.deploymentTargets.test.ts client/src/components/admin/AdminDeploymentTargets.test.tsx scripts/__tests__/verify-cloudflare-target-readiness.test.ts
      - name: Install PostgreSQL for disposable control-plane integration test
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql
      - name: Exercise staging executor through disposable PostgreSQL
        run: npm --workspace @smartspec/web run test -- --maxWorkers=1 server/_core/applicationDatabaseTls.postgres.integration.test.ts server/services/cloudflareRunnerReleaseCatalog.postgres.integration.test.ts server/services/cloudflareMediaProbe.postgres.integration.test.ts server/services/cloudflareStagingDeploymentPostgres.integration.test.ts server/services/cloudflareHyperdriveIntake.postgres.integration.test.ts server/services/registeredWorkerAppBinding.postgres.integration.test.ts server/services/cloudflareRetentionSchedule.postgres.integration.test.ts server/services/cloudflarePrivateDatabasePostgres.integration.test.ts server/services/cloudflareOriginConfiguration.test.ts scripts/__tests__/cloudflare-deployment-schema.test.ts scripts/__tests__/desktop-device-schema.test.ts drizzle/desktopHost.schema.test.ts server/services/__tests__/cloudflarePermissionCatalog.test.ts
        env:
          CLOUDFLARE_TEST_PYTHON: python
          RUN_CLOUDFLARE_STAGING_DB_INTEGRATION: "true"
          RUN_DESKTOP_SCHEMA_DB_INTEGRATION: "true"
          TMPDIR: /tmp
      - name: Verify local readiness without target credentials
        run: |
          npm --workspace @smartspec/web run verify:cloudflare-local-readiness
          npm --workspace @smartspec/web run verify:cloudflare-target-readiness -- --mode local
      - name: Verify patch hygiene
        run: git diff --check

  media-probe-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/runner-app
      - name: Install FFprobe for the explicit CPU fixture
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Verify immutable image build plan
        run: node --test apps/runner-app/cloudflareImagePlan.test.mjs
      - name: Test actual scoped Runner CPU operation
        env:
          SAH_TEST_FFPROBE: /usr/bin/ffprobe
        run: cargo test --manifest-path apps/runner-app/Cargo.toml --locked --lib container -- --include-ignored
      - name: Build standalone Runner for the private HTTP fixture
        run: cargo build --manifest-path apps/runner-app/Cargo.toml --locked --bin smartaihub-runner
      - name: Warm pinned Wrangler CLI cache for workerd fixture
        run: pnpm dlx wrangler@4.151.1 --version
      - name: Verify real workerd R2 and Rust media execution
        env:
          SAH_TEST_FFPROBE: /usr/bin/ffprobe
          SAH_TEST_RUNNER_BINARY: ${{ github.workspace }}/apps/runner-app/target/debug/smartaihub-runner
        run: node --test apps/cloudflare/scripts/canonical-media-probe-runtime.test.mjs apps/runner-app/containerMediaProbe.integration.test.mjs

name: Cloudflare local readiness

on:
  push:
    paths:
      - "apps/cloudflare/**"
      - "apps/web/client/**"
      - "apps/web/vite.config.ts"
      - "apps/web/server/**"
      - "packages/shared/src/contentProtection.ts"
      - "scripts/guards/**"
      - "apps/web/server/services/cloudflareJobAdapters.ts"
      - "apps/web/scripts/verify-cloudflare-*.ts"
      - "ops/feature-187/**"
      - "ops/feature-188/cloudflare-*"
      - ".github/workflows/cloudflare-local-readiness.yml"
  pull_request:
    paths:
      - "apps/cloudflare/**"
      - "apps/web/client/**"
      - "apps/web/vite.config.ts"
      - "apps/web/server/**"
      - "packages/shared/src/contentProtection.ts"
      - "scripts/guards/**"
      - "apps/web/server/services/cloudflareJobAdapters.ts"
      - "apps/web/scripts/verify-cloudflare-*.ts"
      - "ops/feature-187/**"
      - "ops/feature-188/cloudflare-*"
      - ".github/workflows/cloudflare-local-readiness.yml"

permissions:
  contents: read

jobs:
  local-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test Express route architecture guard
        run: node --test scripts/guards/express-route-architecture.test.mjs
      - name: Enforce Hono-first Express route policy
        env:
          GUARD_BASE: ${{ github.event.pull_request.base.ref && format('origin/{0}', github.event.pull_request.base.ref) || github.event.before }}
        run: |
          guard_base="$GUARD_BASE"
          if ! git cat-file -e "${guard_base}^{commit}" 2>/dev/null; then
            guard_base=origin/main
          fi
          node scripts/guards/express-route-architecture.mjs --base="$guard_base"
      - name: Compile Cloudflare runtime package
        run: npm --workspace @smartspec/cloudflare-runtime run check
      - name: Bundle Cloudflare Worker with Wrangler
        run: pnpm dlx wrangler@4.151.1 deploy --config apps/cloudflare/wrangler.jsonc --dry-run --outdir /tmp/smartspec-cloudflare-worker-build
      - name: Build shared Remotion schema package
        run: pnpm --filter @smartspec/remotion-render run build
      - name: Build Vite SPA for staging assets
        run: pnpm --filter @smartspec/web exec vite build --configLoader runner
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Bundle staging Worker and static assets
        run: pnpm dlx wrangler@4.151.1 deploy --config apps/cloudflare/wrangler.staging.jsonc --dry-run --outdir /tmp/smartspec-cloudflare-staging-build
      - name: Guard staging config isolation
        run: node --test apps/cloudflare/wrangler.staging.config.test.mjs
      - name: Smoke test Cloudflare Worker in local workerd
        run: |
          set -euo pipefail
          pnpm dlx wrangler@4.151.1 dev --config apps/cloudflare/wrangler.jsonc --local --port 8799 > "$RUNNER_TEMP/wrangler-hono.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8799/healthz >/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = "true"
          curl -fsS http://127.0.0.1:8799/.well-known/smartaihub-evidence-keys.json | jq -e '.format == "sah-evidence-keys-v1" and .keys == []'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -I http://127.0.0.1:8799/.well-known/smartaihub-evidence-keys.json)" = "200"
          etag=$(curl -sSI http://127.0.0.1:8799/.well-known/smartaihub-evidence-keys.json | awk 'tolower($1) == "etag:" { gsub("\r", ""); print $2 }')
          test -n "$etag"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H "If-None-Match: $etag" http://127.0.0.1:8799/.well-known/smartaihub-evidence-keys.json)" = "304"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/api/auth/session)" = "503"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/native-unknown)" = "501"
      - name: Smoke test staging SPA and API routing in local workerd
        run: |
          set -euo pipefail
          pnpm dlx wrangler@4.151.1 dev --config apps/cloudflare/wrangler.staging.jsonc --local --port 8800 > "$RUNNER_TEMP/wrangler-staging.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 45); do
            if curl -fsS -H 'Sec-Fetch-Mode: navigate' -H 'Sec-Fetch-Dest: document' -H 'Accept: text/html' http://127.0.0.1:8800/ >/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = "true"
          curl -fsS -H 'Sec-Fetch-Mode: navigate' -H 'Sec-Fetch-Dest: document' -H 'Accept: text/html' http://127.0.0.1:8800/app/chat | grep -q '<div id="root">'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Sec-Fetch-Mode: navigate' -H 'Sec-Fetch-Dest: document' -H 'Accept: text/html' http://127.0.0.1:8800/api/unknown)" = "503"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8800/api/auth/session)" = "503"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8800/healthz)" = "200"
          curl -fsS http://127.0.0.1:8800/.well-known/smartaihub-evidence-keys.json | jq -e '.format == "sah-evidence-keys-v1" and .keys == []'
          asset_path=$(curl -fsS http://127.0.0.1:8800/ | grep -oE '/assets/[^" ]+\.(js|css)' | head -n 1)
          test -n "$asset_path"
          cache_control=$(curl -sSI "http://127.0.0.1:8800$asset_path" | awk 'tolower($1) == "cache-control:" { gsub("\r", ""); print tolower($0) }')
          printf '%s\n' "$cache_control" | grep -q 'max-age=31536000'
          printf '%s\n' "$cache_control" | grep -q 'immutable'
          test "$(curl -sSI http://127.0.0.1:8800/ | awk 'tolower($1) == "cache-control:" { gsub("\r", ""); print tolower($0) }' | grep -c 'no-cache')" -ge 1
      - name: Run Cloudflare runtime contract tests
        run: npm --workspace @smartspec/cloudflare-runtime test
      - name: Run web adapter contract tests
        run: npm --workspace @smartspec/web run test -- server/services/__tests__/cloudflareJobAdapters.test.ts server/routes/__tests__/contentProtectionPublicKeys.test.ts server/routers/infrastructure.deploymentTargets.test.ts scripts/__tests__/verify-cloudflare-target-readiness.test.ts
      - name: Verify local readiness without target credentials
        run: |
          npm --workspace @smartspec/web run verify:cloudflare-local-readiness
          npm --workspace @smartspec/web run verify:cloudflare-target-readiness -- --mode local
      - name: Verify patch hygiene
        run: git diff --check

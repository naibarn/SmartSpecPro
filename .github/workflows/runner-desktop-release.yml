name: SmartAIHub Runner desktop review build

run-name: SmartAIHub Runner desktop ${{ inputs.version }} · ${{ inputs.build_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: main
      version:
        description: Installer version (numeric semantic version)
        required: true
        default: 0.2.4
      build_id:
        description: Build correlation ID (set by SmartAIHub when dispatched from the admin page)
        required: false
        default: manual
      platform:
        description: Installer platform
        required: true
        type: choice
        options: [all, windows, macos-universal, checks-only]
        default: all

permissions:
  contents: read

jobs:
  verify-release-admin:
    name: Runner release admin UI and API checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install only the web package dependency graph
        # The current main lockfile omits apps/cloudflare's local shared-package specifier.
        # Resolve the selected test/build graph on the hosted runner without committing that unrelated lockfile repair.
        run: pnpm install --no-frozen-lockfile --filter @smartspec/web... --filter @smartspec/remotion-render...
      - name: Run Runner release UI and API tests
        env:
          JWT_SECRET: test-jwt-secret-32-chars-minimum-1234567890
        run: >-
          pnpm --filter @smartspec/web exec vitest run
          client/src/features/runner-releases/__tests__/RunnerReleasePanel.test.tsx
          client/src/features/desktop-releases/__tests__/RunnerReleaseAdminPanel.test.tsx
          server/services/__tests__/runnerReleaseBuildService.test.ts
          server/routes/__tests__/runnerReleases.test.ts
          --pool=forks --maxWorkers=2
      - name: Build shared Remotion package
        if: inputs.platform == 'checks-only'
        run: npm --workspace @smartspec/remotion-render run build
      - name: Refresh SmartSpecWeb local package snapshot
        if: inputs.platform == 'checks-only'
        run: pnpm install --no-frozen-lockfile --force --filter @smartspec/web...
      - name: Build SmartSpecWeb after Runner checks
        if: inputs.platform == 'checks-only'
        run: pnpm --filter @smartspec/web run build

  build-windows:
    name: Windows x64 NSIS installer
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate version and install Tauri CLI
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+([+-][0-9A-Za-z.-]+)?$') { throw 'version must be numeric semantic version' }
          cargo install tauri-cli --version 2.10.1 --locked
      - name: Build unsigned review installer
        working-directory: apps/runner-desktop
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: cargo tauri build --target x86_64-pc-windows-msvc --bundles nsis --config "{`"version`":`"$env:RELEASE_VERSION`"}"
      - name: Create checksummed manifest
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $installer = Get-ChildItem apps/runner-desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer missing' }
          Copy-Item $installer.FullName dist/
          $item = Get-ChildItem dist/*.exe | Select-Object -First 1
          $hash = (Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{ product='SmartAIHub Runner'; target='x86_64-pc-windows-msvc'; version=$env:RELEASE_VERSION; sourceRef=$env:RELEASE_REF; sourceCommit=(git rev-parse HEAD); installer=$item.Name; sha256=$hash; signingStatus='unsigned-review' }
          $manifest | ConvertTo-Json -Compress | Set-Content -Encoding utf8 dist/manifest.json
          "$hash  $($item.Name)" | Set-Content -Encoding ascii dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: smartaihub-runner-windows-x64-${{ inputs.version }}-unsigned-review
          path: dist/*
          if-no-files-found: error

  build-macos-universal:
    name: macOS Universal DMG
    if: inputs.platform == 'all' || inputs.platform == 'macos-universal'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate version and install Tauri CLI
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          cargo install tauri-cli --version 2.10.1 --locked
      - name: Build unsigned Universal review image
        working-directory: apps/runner-desktop
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: cargo tauri build --target universal-apple-darwin --bundles dmg --config "{\"version\":\"$RELEASE_VERSION\"}"
      - name: Create checksummed manifest
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          mkdir -p dist
          installer=$(find apps/runner-desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$installer"
          cp "$installer" dist/
          file=$(basename "$installer")
          hash=$(shasum -a 256 "dist/$file" | awk '{print $1}')
          INSTALLER="$file" SOURCE_COMMIT="$(git rev-parse HEAD)" SHA256="$hash" node -e 'const fs=require("fs"); const m={product:"SmartAIHub Runner",target:"universal-apple-darwin",architectures:["x86_64","aarch64"],version:process.env.RELEASE_VERSION,sourceRef:process.env.RELEASE_REF,sourceCommit:process.env.SOURCE_COMMIT,installer:process.env.INSTALLER,sha256:process.env.SHA256,signingStatus:"unsigned-review"}; fs.writeFileSync("dist/manifest.json",JSON.stringify(m,null,2)+"\n")'
          echo "$hash  $file" > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: smartaihub-runner-macos-universal-${{ inputs.version }}-unsigned-review
          path: dist/*
          if-no-files-found: error

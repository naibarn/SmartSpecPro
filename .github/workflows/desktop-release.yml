name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
      platform:
        description: "Desktop platform to build"
        required: false
        default: "windows"
        type: choice
        options:
          - windows
          - macos
          - linux
          - all
      bundle_mode:
        description: "Gemma 4 packaging mode for the Tauri installer"
        required: false
        default: "on-demand"
        type: choice
        options:
          - on-demand
          - e2b
          - e4b
          - all

permissions:
  contents: write

jobs:
  resolve-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          platform="${{ github.event.inputs.platform }}"
          case "$platform" in
            windows)
              echo 'matrix={"include":[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","label":"Windows","platform":"windows"}]}' >> "$GITHUB_OUTPUT"
              ;;
            macos)
              echo 'matrix={"include":[{"os":"macos-latest","target":"universal-apple-darwin","label":"macOS","platform":"macos"}]}' >> "$GITHUB_OUTPUT"
              ;;
            linux)
              echo 'matrix={"include":[{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","label":"Linux","platform":"linux"}]}' >> "$GITHUB_OUTPUT"
              ;;
            all)
              echo 'matrix={"include":[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","label":"Windows","platform":"windows"},{"os":"macos-latest","target":"universal-apple-darwin","label":"macOS","platform":"macos"},{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","label":"Linux","platform":"linux"}]}' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported platform input: $platform" >&2
              exit 1
              ;;
          esac

  build:
    needs: [resolve-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-matrix.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare LiteRT-LM and Gemma 4 bundle
        run: |
          BUNDLE_MODE="${{ github.event.inputs.bundle_mode || 'on-demand' }}"
          python apps/tauri-shell/scripts/prepare-litert-lm-bundle.py --bundle-mode "$BUNDLE_MODE"

      - name: Smoke test bundled Gemma 4 runtime
        if: matrix.os == 'ubuntu-22.04' && (github.event.inputs.bundle_mode == 'e2b' || github.event.inputs.bundle_mode == 'all')
        run: |
          npm --workspace=@smartspec/tauri-shell run tauri:smoke:gemma4:e2b
          npm --workspace=@smartspec/tauri-shell run tauri:smoke:gemma4:voice:e2b

      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/tauri-shell
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "SmartAIHub Desktop ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: "See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

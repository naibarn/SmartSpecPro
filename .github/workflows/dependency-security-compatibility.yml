name: Dependency Security Compatibility

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "apps/**/package.json"
      - "packages/**/package.json"
      - "apps/web/server/**"
      - "apps/web/client/src/components/editor/**"
      - "apps/web/client/src/components/guardian/**"
      - "apps/web/client/src/components/GlobalAlerts.tsx"
      - "apps/web/client/src/components/assistant-mascot/**"
      - "apps/web/client/src/components/settings/AssistantAppearancePreferences*"
      - ".github/workflows/dependency-security-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build Remotion render schema package
        run: pnpm --filter @smartspec/remotion-render run build
      - name: Run dependency compatibility regressions
        run: >-
          JWT_SECRET=test-jwt-secret-32-chars-minimum-1234567890
          npm --workspace apps/web run test -- --run --testTimeout=20000
          server/_core/__tests__/proxyAddrTrustRegression.test.ts
          server/_core/oauthProxy.test.ts
          server/__tests__/media-ssrf-validation.test.ts
          server/services/imageProxySafety.test.ts
          server/routers/__tests__/feedback.tenantScope.test.ts
          server/routers/__tests__/marketplaceCapture.uploadStagedAutoReviewShotMedia.test.ts
          server/routes/__tests__/workerRuntime.test.ts
          server/services/uploadContentSafety.test.ts
          server/services/__tests__/mediaAssetService.test.ts
          server/services/__tests__/videoRenderer.test.ts
          server/services/__tests__/notificationEmailService.test.ts
          server/services/billing/emailDelivery.test.ts
          client/src/components/guardian/__tests__/FeedbackButton.test.tsx
          client/src/components/editor/TiptapEditor.test.tsx
          client/src/components/editor/__tests__/paste-handlers.test.ts
          client/src/components/editor/hardening.test.tsx
          client/src/components/editor/serialization-guard.test.ts

  production-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run full production dependency audit
        run: pnpm audit --prod

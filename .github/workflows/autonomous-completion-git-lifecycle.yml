name: Autonomous Completion Git Lifecycle

on:
  pull_request:
    paths:
      - "scripts/development-lifecycle/workspace_authority.py"
      - "scripts/development-lifecycle/test_workspace_authority.py"
      - "apps/web/server/jobs/workspaceAuthorityGithub.ts"
      - "apps/web/server/jobs/workspaceAuthorityGithub.test.ts"
      - "apps/web/server/jobs/workspaceAuthorityGithubList.test.ts"
      - "apps/web/server/jobs/workspaceAuthoritySafeActionJob.ts"
      - "apps/web/server/jobs/workspaceAuthoritySafeActionJob.test.ts"
      - "apps/web/server/services/jobExecutorRegistry.ts"
      - "apps/web/server/services/__tests__/spec267NativeWorkerRecovery.integration.test.ts"
      - "apps/web/server/services/__tests__/support/spec267NativePostgres.ts"
      - "apps/web/server/services/__tests__/support/spec267WorkerClaimSchema.ts"
      - ".github/workflows/autonomous-completion-git-lifecycle.yml"

permissions:
  contents: read

jobs:
  git_lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Run workspace authority tests
        run: python -m unittest scripts.development-lifecycle.test_workspace_authority
      - name: Install web package dependencies
        run: pnpm install --frozen-lockfile --filter @smartspec/web...
      - name: Ensure native PostgreSQL test binaries are available
        run: |
          if ! find /usr/lib/postgresql -type f -name initdb -print -quit 2>/dev/null | grep -q .; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql
          fi
          test -n "$(find /usr/lib/postgresql -type f -name initdb -print -quit)"
          test -n "$(find /usr/lib/postgresql -type f -name pg_ctl -print -quit)"
      - name: Build the worker runtime schema entrypoint
        working-directory: packages/remotion-render
        run: |
          mkdir -p dist
          pnpm exec esbuild src/remotionRenderVideoSchema.ts --bundle --platform=neutral --format=esm --target=es2022 --external:zod --outfile=dist/remotionRenderVideoSchema.js
      - name: Run isolated SPEC-267 native PostgreSQL recovery tests
        working-directory: apps/web
        env:
          RUN_NATIVE_WORKER_POSTGRES_TESTS: "true"
        run: pnpm exec vitest run --maxWorkers=1 --no-file-parallelism server/services/__tests__/spec267NativeWorkerRecovery.integration.test.ts
      - name: Run Git lifecycle adapter and safe action tests
        working-directory: apps/web
        run: pnpm exec vitest run --maxWorkers=1 server/jobs/workspaceAuthorityGithub.test.ts server/jobs/workspaceAuthorityGithubList.test.ts server/jobs/workspaceAuthoritySafeActionJob.test.ts
      - name: Parse canonical worker executor registration
        working-directory: apps/web
        run: pnpm exec esbuild server/services/jobExecutorRegistry.ts --format=esm --platform=node --outfile="$RUNNER_TEMP/jobExecutorRegistry.js"

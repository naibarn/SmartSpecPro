name: Deploy to Production

on:
  release:
    types: [created]
  workflow_dispatch:
  workflow_run:
    workflows: ["Remotion Executor Release Gates"]
    types: [completed]

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Production deployment requires environment approval
    # Configure 'production' environment in GitHub repo settings with required reviewers
    environment:
      name: production
      url: https://smartaihub.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Download promoted Remotion runtime packs
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          pattern: remotion-runtime-*
          merge-multiple: true
          path: apps/web/client/public/releases/runtime

      - name: Verify Remotion archive and manifest pairing
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          shopt -s nullglob
          archives=(apps/web/client/public/releases/runtime/*.zip)
          test "${#archives[@]}" -eq 3
          for archive in "${archives[@]}"; do
            test -s "$archive"
            test -s "$archive.manifest.json"
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

      - name: Scan for leaked secrets
        uses: trufflesecurity/trufflehog@ba0a524d6e51744d9d4e306bc57ac5d6ca5173ea
        with:
          path: ./
          extra_args: --only-verified --fail

      - name: Set image tags
        id: tags
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            echo "RELEASE_TAG=runtime-${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=manual-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          else
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push all images
        run: |
          docker build -f docker/Dockerfile.node-api \
            -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartspec-images/node-api:${{ steps.tags.outputs.RELEASE_TAG }} \
            .
          docker push ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartspec-images/node-api:${{ steps.tags.outputs.RELEASE_TAG }}

          docker build -f docker/Dockerfile.python-orchestrator \
            -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartspec-images/python-orchestrator:${{ steps.tags.outputs.RELEASE_TAG }} \
            .
          docker push ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartspec-images/python-orchestrator:${{ steps.tags.outputs.RELEASE_TAG }}

          docker build -f docker/Dockerfile.video-job-runner \
            -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartspec-images/video-job-runner:${{ steps.tags.outputs.RELEASE_TAG }} \
            .
          docker push ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartspec-images/video-job-runner:${{ steps.tags.outputs.RELEASE_TAG }}

      - name: Scan node-api image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: '${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartspec-images/node-api:${{ steps.tags.outputs.RELEASE_TAG }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Scan python-orchestrator image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: '${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartspec-images/python-orchestrator:${{ steps.tags.outputs.RELEASE_TAG }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Scan video-job-runner image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: '${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartspec-images/video-job-runner:${{ steps.tags.outputs.RELEASE_TAG }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Run database migrations (Production)
        env:
          DATABASE_URL: ${{ secrets.NEON_PROD_DB_URL }}
        run: |
          cd apps/web
          npm ci --legacy-peer-deps
          npm run db:migrate

      - name: Deploy node-api to Cloud Run (10% canary)
        env:
          SMARTAIHUB_RUNTIME_PACK_PUBLIC_KEY: ${{ secrets.SMARTAIHUB_RUNTIME_PACK_PUBLIC_KEY }}
        run: |
          test -n "$SMARTAIHUB_RUNTIME_PACK_PUBLIC_KEY"
          gcloud run deploy node-api \
            --image=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartspec-images/node-api:${{ steps.tags.outputs.RELEASE_TAG }} \
            --platform=managed \
            --region=${{ secrets.GCP_REGION }} \
            --service-account=cloud-run-api@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --tag=release-${{ steps.tags.outputs.RELEASE_TAG }} \
            --no-traffic \
            --set-env-vars="^@^ENVIRONMENT=production@RELEASE=${{ steps.tags.outputs.RELEASE_TAG }}@SMARTAIHUB_RUNTIME_PACK_PUBLIC_KEY=${SMARTAIHUB_RUNTIME_PACK_PUBLIC_KEY}"

          gcloud run services update-traffic node-api \
            --to-revisions=release-${{ steps.tags.outputs.RELEASE_TAG }}=10 \
            --region=${{ secrets.GCP_REGION }}

      - name: Deploy python-orchestrator to Cloud Run (10% canary)
        run: |
          gcloud run deploy python-orchestrator \
            --image=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartspec-images/python-orchestrator:${{ steps.tags.outputs.RELEASE_TAG }} \
            --platform=managed \
            --region=${{ secrets.GCP_REGION }} \
            --service-account=cloud-run-api@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --no-allow-unauthenticated \
            --tag=release-${{ steps.tags.outputs.RELEASE_TAG }} \
            --no-traffic \
            --set-env-vars="ENVIRONMENT=production,RELEASE=${{ steps.tags.outputs.RELEASE_TAG }}"

          gcloud run services update-traffic python-orchestrator \
            --to-revisions=release-${{ steps.tags.outputs.RELEASE_TAG }}=10 \
            --region=${{ secrets.GCP_REGION }}

      - name: Update Cloud Run Job (video-job-runner)
        run: |
          gcloud run jobs update video-job-runner \
            --image=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartspec-images/video-job-runner:${{ steps.tags.outputs.RELEASE_TAG }} \
            --region=${{ secrets.GCP_REGION }}

      - name: Smoke test (10% canary)
        id: smoke-test
        continue-on-error: true
        run: |
          CANARY_URL=$(gcloud run services describe node-api \
            --region=${{ secrets.GCP_REGION }} \
            --format='value(status.traffic[tag=release-${{ steps.tags.outputs.RELEASE_TAG }}].url)')
          bash scripts/smoke-test.sh "${CANARY_URL}"

      - name: Rollback on smoke test failure
        if: steps.smoke-test.outcome == 'failure'
        run: |
          echo "Smoke tests failed. Rolling back canary traffic."
          gcloud run services update-traffic node-api \
            --clear-tags \
            --to-latest \
            --region=${{ secrets.GCP_REGION }}

          gcloud run services update-traffic python-orchestrator \
            --clear-tags \
            --to-latest \
            --region=${{ secrets.GCP_REGION }}

          exit 1

      - name: Shift to 50% traffic
        if: steps.smoke-test.outcome == 'success'
        run: |
          gcloud run services update-traffic node-api \
            --to-revisions=release-${{ steps.tags.outputs.RELEASE_TAG }}=50 \
            --region=${{ secrets.GCP_REGION }}

          gcloud run services update-traffic python-orchestrator \
            --to-revisions=release-${{ steps.tags.outputs.RELEASE_TAG }}=50 \
            --region=${{ secrets.GCP_REGION }}

      - name: Wait for manual approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.token }}
          approvers: admin-user1,admin-user2
          minimum-approvals: 1
          issue-title: "Approve production deployment to 100%"

      - name: Shift to 100% traffic
        run: |
          gcloud run services update-traffic node-api \
            --to-latest \
            --region=${{ secrets.GCP_REGION }}

          gcloud run services update-traffic python-orchestrator \
            --to-latest \
            --region=${{ secrets.GCP_REGION }}

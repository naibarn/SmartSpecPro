    source_tree_note: job and transport files currently have extensive uncommitted changes; static call-site counts are not stable evidence
    unknown_callers: true

kv_pilot:
  status: implementation_authorized_target_enable_blocked
  candidate: apps/web/server/services/searchResultCache.ts
  owner_decision:
    beta_users: 2
    cache_is_business_critical: false
    maintenance_pause_allowed: true
    fixed_redis_observation_window_days: none
    decision_date: 2026-09-26
  reasons:
    - existing caller runs in the Node application, not the Cloudflare Worker binding context
    - Worker environment contract has no KV namespace binding
    - target-account evidence and deployment identity are absent in this checkout
    - tenant/user key isolation and bounded TTL must be enforced in the new endpoint
    - KV miss, expiry, and cross-location stale behavior are acceptable only because this cache is disposable
  required_before_pilot:
    - implement authenticated internal Worker endpoint and SEARCH_RESULT_CACHE binding contract
    - implement Node client with cache miss/no-op on failure and no Redis fallback when Cloudflare KV is selected
    - add Admin switch, readiness probe and complete endpoint/binding/secret deployment guide
    - verify tenant/user key isolation, current 15m/60m TTLs, freshness bypass, and cache-loss behavior
    - obtain real target binding/secret evidence before enabling in the target environment
  cutover_mode: controlled_maintenance_pause_then_direct_kv_enable
  data_migration: none_cache_is_disposable_start_cold
  post_cutover_monitoring: immediate_bug_detection_not_a_retirement_timer


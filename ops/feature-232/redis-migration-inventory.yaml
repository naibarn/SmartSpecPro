    hostname: https://runtime.smartaihub.app
    worker: smartspec-cloudflare-runtime
    worker_version_id: f6f0ba85-3d23-476e-b8af-55840609442d
    namespace_binding: SEARCH_RESULT_CACHE
    namespace_id: df6d9bead8644d0f8f334f59b6bdfbeb
    worker_secret_name: CLOUDFLARE_SEARCH_CACHE_TOKEN # secret value is not recorded
    web_environment_keys: [CLOUDFLARE_RUNTIME_URL, CLOUDFLARE_SEARCH_CACHE_TOKEN] # values are not recorded
    activation: disabled # queue/job runtime remains inactive
    probes:
      healthz_http: 200
      authenticated_cache_probe_http: 200
      authenticated_cache_probe_ready: true
      readyz_http: 503 # expected while unrelated job/runtime bindings are absent
    application:
      provider_setting: cloudflare_kv
      adapter_set_get_roundtrip: passed
      synthetic_tenant_isolation: passed
      synthetic_cross_tenant_read: empty

      - file: apps/web/server/jobs
        symbol: BullMQ queue/worker/scheduler registrations
        semantics: recurring and asynchronous application work
        target: existing worker_jobs plus outbox and per-family Cloudflare Queue/Workflow/Runner transport
        migration_status: do_not_promote_until_current_diff_and_live_family_ownership_reconcile
      - file: apps/web/server/services/verticalDramaShotVideoPromptJobs.ts

responsibility_groups:
  G1_cache:
    status: partial_static_discovery
    examples:
      - file: apps/web/server/services/searchResultCache.ts
        symbol: SearchResultCache
        semantics: tenant and user keyed search-result cache with 15m/60m TTL
        target: Workers KV only after data classification; canonical search/provider path on miss
        migration_status: owner_authorized_local_implementation_target_probe_required
      - file: apps/web/server/services/groupsService.ts
        symbol: getUserGroups
        semantics: tenant/user scoped authorization-adjacent cache with invalidation
        target: PostgreSQL fresh read or noncritical cache only after permission-staleness review
        migration_status: excluded_from_first_kv_pilot
      - file: apps/web/server/routers/adminOps.ts
        symbol: admin operation statistics cache
        semantics: admin-only cached projection
        target: PostgreSQL/source recomputation on miss; classify payload and freshness first
        migration_status: unverified
    unknown_callers: true

  G2_auth_session_revocation:
    status: partial_static_discovery
    examples:
      - file: apps/web/server/_core/revocation.ts
        symbol: Redis revocation client
        semantics: token/session revocation decision
        target: PostgreSQL HYPERDRIVE_FRESH; DO only for scoped coordination; KV non-authoritative hint only
        migration_status: blocked_on_active_session_and_ttl_inventory
      - file: apps/web/server/services/redisEphemeralKeyRegistry.ts
        symbol: setEphemeralJson/getEphemeralJson/setEphemeralText/getEphemeralText
        semantics: short-lived cross-instance ephemeral state; callers must be classified individually
        target: PostgreSQL or DO for correctness-sensitive state; KV only for proven non-authoritative hints
        migration_status: unverified
    unknown_callers: true

  G3_rate_limit_quota_idempotency:
    status: partial_static_discovery
    examples:
      - file: apps/web/server/middleware/distributedRateLimit.ts
        symbol: distributed rate limiter
        semantics: Redis sorted-set sliding-window counter
        target: Workers Rate Limiting for approximate abuse controls; DO for exact shared admission
        migration_status: policy_and_route_inventory_required
      - file: apps/web/server/services/apiKeyRateLimiter.ts
        symbol: API key rate limiter
        semantics: API key scoped counters and decisions
        target: Workers Rate Limiting or DO by policy; PostgreSQL for billable quota
        migration_status: policy_and_route_inventory_required
      - file: apps/web/server/middleware/idempotencyMiddleware.ts
        symbol: idempotency middleware
        semantics: temporary request lock plus cached response
        target: PostgreSQL canonical idempotency for business effects; KV is not an atomic lock substitute
        migration_status: blocked_on_effect_and_idempotency_audit
    unknown_callers: true

  G4_locks_leases_semaphores:
    status: partial_static_discovery
    examples:
      - file: apps/web/server/services/redisSemaphore.ts
        symbol: acquireSemaphore/getSemaphoreCount
        semantics: atomic Lua semaphore with TTL for cross-process concurrency
        target: DO for per-entity serialization plus PostgreSQL fencing for durable writes
        migration_status: blocked_on_resource_owner_and_fencing_inventory
      - file: apps/web/server/routers/presentation.ts
        symbol: presentation task lock/progress state
        semantics: lock ownership and task progress
        target: canonical worker_jobs lease/fencing and durable job state
        migration_status: requires per-operation mapping
      - file: python-backend/app/services/browser_pool.py
        symbol: browser session semaphore
        semantics: user/tenant concurrency limits
        target: DO or canonical live-session lease design; not KV
        migration_status: blocked_on_live_session_contract
    unknown_callers: true

  G5_pubsub_realtime:
    status: partial_static_discovery
    examples:
      - file: apps/web/server/services/notificationWebhookService.ts
        symbol: realtime queue/pub-sub callers
        semantics: Redis-backed delivery and notifications

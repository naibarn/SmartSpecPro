[Slice]
# Development/agent sessions share this host with production services.
# Keep their aggregate usage bounded so system.slice retains room for SSH,
# Docker, PostgreSQL, and the web/backend services.
MemoryHigh=18G
MemoryMax=20G
MemorySwapMax=4G
# 2026-07-22 incident: once this slice sat at MemoryHigh with its swap
# ceiling pinned, memory.high reclaim degraded into a permanent whole-slice
# stall (PSI 93%, SSH logins hung, host needed a power cycle) because nothing
# ever killed a process. Let systemd-oomd break that stall by killing the
# heaviest descendant cgroup when slice memory pressure stays high.
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%

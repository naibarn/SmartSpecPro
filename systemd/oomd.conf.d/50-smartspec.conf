# systemd-oomd reaction time for the user-1000.slice pressure-kill policy
# (ManagedOOMMemoryPressure=kill in systemd/user-1000.slice.d/). The default
# 30s window is longer than needed; 20s of sustained >=50% memory pressure in
# a throttled slice is already unrecoverable without a kill.
# Installed to /etc/systemd/oomd.conf.d/ by scripts/finalize-autostart.sh.
[OOM]
DefaultMemoryPressureDurationSec=20s

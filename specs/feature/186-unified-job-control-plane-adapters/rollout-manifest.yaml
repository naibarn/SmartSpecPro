      - vertical_drama.episode_stage
      - vertical_drama.interactive
      - vertical_drama.shot_prompt
      - vertical_drama.shot_video_prompt
      - vertical_drama.story
      - storyboard.skill.run
      - video.intelligence
    active_adapter: postgres-pull
    enable_flag: FEATURE_186_HARD_CUTOVER=true
    legacy_drain: Redis domain projections remain only as compatibility projections until canonical status/result readers and checkpoint persistence pass their own evidence gates
    rollback: unset FEATURE_186_HARD_CUTOVER and drain canonical jobs before restoring the legacy producer path
    evidence:
      - apps/web/server/services/feature186VerticalDramaJobAdapter.ts
      - apps/web/server/services/__tests__/jobControlPlane.test.ts
      - apps/web/server/services/__tests__/unifiedJobConsumer.test.ts
  - wave: 5

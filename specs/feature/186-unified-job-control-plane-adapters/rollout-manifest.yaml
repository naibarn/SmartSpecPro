rollout_waves:
  - wave: 1
    name: node-webhook-control-plane
    status: implemented-local-not-production-complete
    job_types:
      - webhook.dispatch
      - webhook.api_delivery
      - embedding.generate
    active_adapter: postgres-pull
    enable_flag: FEATURE_186_HARD_CUTOVER=true
    transport_legacy_drain: webhookDeliveryService legacy API-webhook queue remains disabled only when the flag is true
    rollback: unset FEATURE_186_HARD_CUTOVER and drain canonical jobs before restoring legacy producer
    evidence:
      - apps/web/server/services/__tests__/webhookDispatchQueue.hardCutover.test.ts
      - apps/web/server/services/__tests__/jobTransportAdapters.test.ts
      - apps/web/server/services/__tests__/unifiedJobConsumer.test.ts
  - wave: 2
    name: tenant-bound-python-postgres-pull
    status: implemented-local-not-production-complete
    job_types:
      - python.legacy_task
    active_adapter: postgres-pull
    enable_flag: FEATURE_186_HARD_CUTOVER=true plus FEATURE_186_POSTGRES_PYTHON_WORKER=true
    producer_boundary: python-backend/app/services/job_control_plane.py
    executor: python-backend/app/workers/postgres_job_worker.py
    legacy_drain: centralized legacy status adapter remains available only for rollback and in-flight legacy drain
    rollback: unset FEATURE_186_POSTGRES_PYTHON_WORKER; preserve canonical rows and let approved compatibility producers drain
    evidence:
      - python-backend/tests/services/test_job_control_plane.py
      - apps/web/server/services/__tests__/jobTransportAdapters.test.ts
  - wave: 3
    name: node-domain-and-python-media-adapters
    status: implemented-local-not-production-complete
    job_types:
      - capacity.assessment
      - channel.delivery
      - automation.execute
      - database.backup
      - database.backup.maintenance
      - library.trash_purge
      - python.media
    active_adapter: postgres-direct-or-postgres-pull
    enable_flag: FEATURE_186_HARD_CUTOVER=true plus FEATURE_186_POSTGRES_PYTHON_WORKER=true for Python jobs
    legacy_drain: canonical status/recovery owns hard-cutover jobs; centralized legacy adapter remains for rollback drain
    rollback: disable the relevant hard-cutover flag and preserve canonical rows and terminal history
    evidence:
      - python-backend/app/tasks/unified_job_task.py
      - python-backend/app/workers/postgres_job_worker.py
      - apps/web/server/services/__tests__/jobControlPlane.test.ts
  - wave: 4
    name: node-vertical-drama-and-video-intelligence-adapters
    status: implemented-local-not-production-complete
    job_types:

[spec_handoff]
schema_version = 1

# These paths identify collections, never individual Spec IDs.
canonical_roots = [
  "specs/feature",
  "specs/quick",
  "specs/project",
  "specs/security",
]

# Read-only historical/candidate roots. Records here never become canonical
# solely because their directory names resemble current Specs.
alternate_roots = [
  "docs/portable-skill-pack/specs",
]

# Configured collection behavior, independent of any particular Spec ID.
planning_roots = ["specs/quick"]

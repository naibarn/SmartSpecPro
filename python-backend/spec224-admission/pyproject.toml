[project]
name = "spec224-admission-profile"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "starlette>=0.35.0",
    "pydantic>=2.12.2,<3",
    "pydantic-settings>=2.3.0",
    "sqlalchemy==2.0.25",
    "asyncpg==0.29.0",
    "structlog==24.1.0",
    "httpx>=0.24.1",
    "python-jose[cryptography]==3.3.0",
]

[dependency-groups]
admission-tests = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
]

[tool.uv]
package = false

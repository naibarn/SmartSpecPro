version: '3.8'
# SmartSpec Pro - Full Docker Compose Configuration
# This file sets up the complete infrastructure and application services
#
# IMPORTANT: Copy .env.example to .env and set required values before starting
#
# Infrastructure Services:
# - PostgreSQL: Primary database
# - Redis: Shared cache
# - ChromaDB: Vector store for RAG
#
# Application Services:
# - python-backend: FastAPI backend with LangGraph
# - smartspec-web: Main web application
# - docker-status: Docker container monitoring
# - api-generator: API code generation service
# - control-plane: Control plane service
#
# Usage:
#   docker-compose -f docker-compose.full.yml up -d
#   docker-compose -f docker-compose.full.yml --profile tools up api-generator

services:
  # ============================================
  # INFRASTRUCTURE SERVICES
  # ============================================

  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg15
    container_name: smartspec-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartspec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-smartspec}
    ports:
      # Bound to localhost only — not accessible from external network
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./python-backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartspec -d smartspec"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    memswap_limit: 2G
    networks:
      - data

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: smartspec-redis
    ports:
      # Bound to localhost only — not accessible from external network
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    memswap_limit: 512M
    networks:
      - data

  # ChromaDB Vector Store (for RAG features)
  chromadb:
    image: chromadb/chroma:latest
    container_name: smartspec-chromadb
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    memswap_limit: 1G
    networks:
      - data

  # ============================================
  # APPLICATION SERVICES
  # ============================================

  # Python Backend (FastAPI + LangGraph)
  python-backend:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: smartspec-python-backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-smartspec}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-smartspec}
      - REDIS_URL=redis://redis:6379
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    memswap_limit: 2G
    networks:
      - backend
      - data

  # SmartSpec Web Application
  smartspec-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: smartspec-web
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-smartspec}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-smartspec}
      - REDIS_URL=redis://redis:6379
      - BACKEND_URL=http://python-backend:8000
      # CRITICAL: Override SESSION_SECRET in production with a strong random value
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set to a strong random value}
      - MARKETPLACE_CAPTURE_ENABLED=${MARKETPLACE_CAPTURE_ENABLED:-false}
      - MARKETPLACE_EXTENSION_ALLOWED_ORIGINS=${MARKETPLACE_EXTENSION_ALLOWED_ORIGINS:-}
      - MARKETPLACE_CAPTURE_MAX_UPLOAD_MB=${MARKETPLACE_CAPTURE_MAX_UPLOAD_MB:-10}
      - MARKETPLACE_CAPTURE_LLM_ENABLED=${MARKETPLACE_CAPTURE_LLM_ENABLED:-false}
      - MARKETPLACE_CAPTURE_LLM_MODEL=${MARKETPLACE_CAPTURE_LLM_MODEL:-gpt-4.1-mini}
      - MARKETPLACE_CAPTURE_LLM_GATEWAY_URL=${MARKETPLACE_CAPTURE_LLM_GATEWAY_URL:-http://127.0.0.1:3000}
      - MARKETPLACE_HYPERFRAMES_RUNTIME_READY=${MARKETPLACE_HYPERFRAMES_RUNTIME_READY:-false}
      - HYPERFRAMES_RUNTIME_MODE=${HYPERFRAMES_RUNTIME_MODE:-cli}
      - HYPERFRAMES_OFFICIAL_RUNTIME_READY=${HYPERFRAMES_OFFICIAL_RUNTIME_READY:-0}
      - HYPERFRAMES_CLI_BINARY=${HYPERFRAMES_CLI_BINARY:-}
      - HYPERFRAMES_BROWSER_BINARY=${HYPERFRAMES_BROWSER_BINARY:-}
      - HYPERFRAMES_FFMPEG_BINARY=${HYPERFRAMES_FFMPEG_BINARY:-}
      - HYPERFRAMES_FFPROBE_BINARY=${HYPERFRAMES_FFPROBE_BINARY:-}
      - HYPERFRAMES_THAI_FONT_PATH=${HYPERFRAMES_THAI_FONT_PATH:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    memswap_limit: 2G
    networks:
      - frontend
      - backend

  # Docker Status Monitor
  docker-status:
    build:
      context: ./docker-status
      dockerfile: Dockerfile
    container_name: smartspec-docker-status
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-smartspec}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-smartspec}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    memswap_limit: 1G
    networks:
      - frontend
      - backend

  # Control Plane Service
  control-plane:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    container_name: smartspec-control-plane
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-smartspec}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-smartspec}
      - CONTROL_PLANE_API_KEY=${CONTROL_PLANE_API_KEY:-dev_api_key_1234567890123456}
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_change_in_production_12345678}
      - R2_ENDPOINT=${R2_ENDPOINT:-https://mock.r2.cloudflarestorage.com}
      - R2_BUCKET=${R2_BUCKET:-smartspec-artifacts}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-mock_key}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-mock_secret}
    ports:
      - "127.0.0.1:7070:7070"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    memswap_limit: 1G
    networks:
      - frontend
      - backend

  # API Generator (Optional - run on demand)
  api-generator:
    build:
      context: ./api-generator
      dockerfile: Dockerfile
    container_name: smartspec-api-generator
    volumes:
      - ./api-generator/output:/app/output
    profiles:
      - tools
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    memswap_limit: 1G
    networks:
      - backend

# ============================================
# VOLUMES
# ============================================
volumes:
  postgres_data:
    name: smartspec_postgres_data
    driver: local
  redis_data:
    name: smartspec_redis_data
    driver: local
  chroma_data:
    driver: local

# ============================================
# NETWORKS
# ============================================
networks:
  frontend:
    name: smartspec-frontend
    driver: bridge
  backend:
    name: smartspec-backend
    driver: bridge
    internal: true
  data:
    name: smartspec-data
    driver: bridge
    # Keep this non-internal so localhost-bound database/cache ports remain
    # reachable by the host-run systemd web/backend services.

version: '3.8'

# SmartSpec Pro - Docker Compose Configuration
# This file sets up the required infrastructure services
#
# IMPORTANT: Copy .env.example to .env and set required values before starting
#
# Services:
# - PostgreSQL: Primary database
# - PostgreSQL: Durable application state and worker job control plane
# - ChromaDB: Vector store for RAG

services:
  # PostgreSQL Database
  postgres:
    image: smartspec-postgres-postgis:pg15
    build:
      context: .
      dockerfile: docker/Dockerfile.postgres-postgis
    container_name: smartspec-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartspec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-smartspec}
    ports:
      # Bound to localhost only — not accessible from external network
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./python-backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartspec -d smartspec"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ChromaDB Vector Store (optional - for RAG features)
  chromadb:
    image: chromadb/chroma:latest
    container_name: smartspec-chromadb
    ports:
      # Bound to localhost only — not accessible from external network
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

volumes:
  postgres_data:
    driver: local
    name: smartspec_postgres_data
  chroma_data:
    driver: local

# Networks (optional - for service isolation)
networks:
  default:
    name: smartspec-network

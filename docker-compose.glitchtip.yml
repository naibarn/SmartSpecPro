# GlitchTip — Self-hosted Sentry-compatible error tracking
#
# Prerequisites: Run ./scripts/setup-glitchtip.sh only when its Redis service is available.
# Access: https://glitchtip.smartaihub.app
#
# Start: docker compose -f docker-compose.glitchtip.yml up -d
# Stop:  docker compose -f docker-compose.glitchtip.yml down
# Logs:  docker compose -f docker-compose.glitchtip.yml logs -f

services:
  glitchtip-web:
    image: glitchtip/glitchtip:latest
    container_name: smartspec-glitchtip-web
    ports:
      # Exposed for Cloudflare Tunnel (cloudflared → localhost:8084)
      - "127.0.0.1:8084:8000"
    env_file:
      - .env.glitchtip
    networks:
      - smartspec-network
    extra_hosts:
      # Access host PostgreSQL and Redis from inside the container
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)\" >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    memswap_limit: 1G

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    container_name: smartspec-glitchtip-worker
    # django-vtasks performs a Redis task-rescue call before entering its
    # retrying consumer loop. If Docker starts this container before Redis,
    # that initial DNS/connect error kills the worker task while the wrapper
    # process stays alive. Wait for an authenticated PING through the
    # configured URL (including its selected DB) before starting the worker.
    command:
      - /bin/sh
      - -ec
      - |
        until python -c 'import os; from valkey import Valkey; c=Valkey.from_url(os.environ["REDIS_URL"],socket_connect_timeout=2,socket_timeout=2); assert c.ping(); c.close()' >/dev/null 2>&1; do
          echo "Waiting for GlitchTip task backend..."
          sleep 2
        done
        exec ./bin/run-worker.sh --scheduler
    env_file:
      - .env.glitchtip
    networks:
      - smartspec-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 128M
    # The worker crossed 512 MiB and was OOM-killed. Keep it bounded, but
    # leave enough resident headroom for Celery and the scheduler together.
    memswap_limit: 1G

networks:
  smartspec-network:
    external: true

version: '3.8'

# SmartSpecPro Development Environment
# Usage: ./dev.sh start

services:
  # ============================================
  # Infrastructure Services
  # ============================================
  
  postgres:
    image: postgres:15-alpine
    container_name: smartspec-postgres
    environment:
      POSTGRES_USER: smartspec
      POSTGRES_PASSWORD: smartspec_dev
      POSTGRES_DB: smartspec
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartspec"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smartspec-network

  redis:
    image: redis:7-alpine
    container_name: smartspec-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smartspec-network

  # ============================================
  # Backend Services
  # ============================================
  
  python-backend:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: smartspec-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://smartspec:smartspec_dev@postgres:5432/smartspec
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - SMARTSPEC_PROXY_TOKEN=dev_token_12345
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:5173
      - JWT_SECRET=dev_jwt_secret_change_in_production
      - CONTROL_PLANE_URL=http://control-plane:7070
      - CONTROL_PLANE_API_KEY=dev_control_plane_api_key_change_in_production
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - KIE_AI_API_KEY=${KIE_AI_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - MEDIA_STORAGE_PATH=./media_storage
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - CDN_BASE_URL=${CDN_BASE_URL:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    ports:
      - "8001:8000"
    volumes:
      - ./python-backend:/app
      - python_cache:/root/.cache
      - media_storage:/app/media_storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - smartspec-network
    restart: unless-stopped

  celery-worker:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: smartspec-celery-worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://smartspec:smartspec_dev@postgres:5432/smartspec
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - KIE_AI_API_KEY=${KIE_AI_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - MEDIA_STORAGE_PATH=./media_storage
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - CDN_BASE_URL=${CDN_BASE_URL:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./python-backend:/app
      - media_storage:/app/media_storage
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - smartspec-network
    restart: unless-stopped

  celery-beat:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: smartspec-celery-beat
    environment:
      - DATABASE_URL=postgresql+asyncpg://smartspec:smartspec_dev@postgres:5432/smartspec
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./python-backend:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A app.core.celery_app beat --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat-schedule || exit 0"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - smartspec-network
    restart: unless-stopped

  flower:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: smartspec-flower
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "5555:5555"
    volumes:
      - ./python-backend:/app
    depends_on:
      - redis
      - celery-worker
    command: celery -A app.core.celery_app flower --port=5555 --broker=redis://redis:6379/0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5555/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - smartspec-network
    restart: unless-stopped

  control-plane:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    container_name: smartspec-control-plane
    environment:
      - NODE_ENV=development
      - PORT=7070
      - DATABASE_URL=postgresql+asyncpg://smartspec:smartspec_dev@postgres:5432/smartspec
      - CONTROL_PLANE_API_KEY=dev_control_plane_api_key_change_in_production
      - JWT_SECRET=dev_jwt_secret_change_in_production_at_least_16_chars
      - JWT_ISSUER=smartspec-control-plane
      - JWT_AUDIENCE=smartspec
      - R2_ENDPOINT=${R2_ENDPOINT:-https://fake-r2.example.com}
      - R2_REGION=${R2_REGION:-auto}
      - R2_BUCKET=${R2_BUCKET:-dev-bucket}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-dev_access_key_id}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-dev_secret_access_key}
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    ports:
      - "7070:7070"
    volumes:
      - ./control-plane:/app
      - control_plane_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: npx tsx watch src/index.ts
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:7070/ | grep -q 'Route' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - smartspec-network
    restart: unless-stopped

  # ============================================
  # Frontend Services
  # ============================================
  
  smartspec-web:
    build:
      context: ./SmartSpecWeb
      dockerfile: Dockerfile
      target: development
    container_name: smartspec-web
    environment:
      - VITE_API_URL=http://localhost:8001
      - VITE_CONTROL_PLANE_URL=http://localhost:7070
      - VITE_WS_URL=ws://localhost:8001
      - NODE_ENV=development
      - DATABASE_URL=postgresql://smartspec:smartspec_dev@postgres:5432/smartspec
      - OAUTH_SERVER_URL=http://python-backend:8000
      - JWT_SECRET=dev_jwt_secret_change_in_production_at_least_16_chars
    ports:
      - "3000:3000"
    volumes:
      - ./SmartSpecWeb:/app
      - web_node_modules:/app/node_modules
      - /app/.next
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      python-backend:
        condition: service_started
      control-plane:
        condition: service_started
    command: pnpm dev --host 0.0.0.0
    networks:
      - smartspec-network
    restart: unless-stopped

  # ============================================
  # Monitoring Services
  # ============================================
  
  docker-status:
    build:
      context: ./docker-status
      dockerfile: Dockerfile
    container_name: smartspec-docker-status
    user: root
    environment:
      - OAUTH_SERVER_URL=http://python-backend:8000
      - DATABASE_URL=postgresql://smartspec:smartspec_dev@postgres:5432/smartspec
      - NODE_ENV=development
      - PORT=3000
      - JWT_SECRET=dev_jwt_secret_change_in_production_at_least_16_chars
      - VITE_APP_ID=docker-status
    ports:
      - "3001:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-status:/app
      - docker_status_node_modules:/app/node_modules
    depends_on:
      - python-backend
    command: pnpm dev
    networks:
      - smartspec-network
    restart: unless-stopped

  # ============================================
  # Reverse Proxy (Nginx)
  # ============================================

  nginx:
    image: nginx:alpine
    container_name: smartspec-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - smartspec-web
      - python-backend
      - docker-status
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/nginx-health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - smartspec-network
    restart: unless-stopped

  # ============================================
  # Optional: Database Admin
  # ============================================
  
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smartspec-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@smartspec.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - smartspec-network
    profiles:
      - tools

  # ============================================
  # Optional: Redis Admin
  # ============================================
  
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: smartspec-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - smartspec-network
    profiles:
      - tools

# ============================================
# Networks
# ============================================

networks:
  smartspec-network:
    driver: bridge

# ============================================
# Volumes
# ============================================

volumes:
  postgres_data:
    name: smartspec_postgres_data
  redis_data:
    name: smartspec_redis_data
  python_cache:
    name: smartspec_python_cache
  media_storage:
    name: smartspec_media_storage
  web_node_modules:
    name: smartspec_web_node_modules
  control_plane_node_modules:
    name: smartspec_control_plane_node_modules
  docker_status_node_modules:
    name: smartspec_docker_status_node_modules
  pgadmin_data:
    name: smartspec_pgadmin_data

# =============================================================================
# SmartSpecPro — OpenSandbox Nginx Configuration
# =============================================================================
#
# TLS termination + reverse proxy for sandbox.smartaihub.app
#
# Deployment:
#   This file is copied to /etc/nginx/sites-available/sandbox and symlinked
#   to /etc/nginx/sites-enabled/sandbox by setup-hetzner-sandbox.sh.
#   Certbot will append SSL directives to the HTTPS server block.
#
# IMPORTANT: The string EXPECTED_API_KEY_PLACEHOLDER is replaced with the
# actual OPENSANDBOX_API_KEY by setup-hetzner-sandbox.sh during deployment.
# NEVER commit actual API key values to source control.
# =============================================================================

# ---------------------------------------------------------------------------
# Rate limiting zone (defense against runaway clients)
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=sandbox_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=sandbox_health:10m rate=120r/m;

# ---------------------------------------------------------------------------
# HTTP — Redirect to HTTPS + ACME challenge
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name sandbox.smartaihub.app;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — TLS termination + reverse proxy
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sandbox.smartaihub.app;

    # ---- TLS (populated / managed by Certbot) ----
    # Certbot will insert ssl_certificate and ssl_certificate_key here.
    # The stanza below sets protocol and cipher hardening on top of that.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ---- Body size limit (file staging) ----
    client_max_body_size 100M;

    # ---- Common proxy settings ----
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # ---------------------------------------------------------------------------
    # /health — No auth required (used by uptime monitors and GCP health probes)
    # ---------------------------------------------------------------------------
    location = /health {
        limit_req zone=sandbox_health burst=20 nodelay;

        proxy_pass              http://opensandbox-server:8080;
        proxy_connect_timeout   10s;
        proxy_read_timeout      30s;
        proxy_send_timeout      30s;
    }

    # ---------------------------------------------------------------------------
    # /api/ — API key required (defense-in-depth; OpenSandbox also validates it)
    # ---------------------------------------------------------------------------
    location /api/ {
        limit_req zone=sandbox_api burst=10 nodelay;

        # Defense-in-depth: validate API key at Nginx level before forwarding.
        # The placeholder below is replaced by setup-hetzner-sandbox.sh.
        if ($http_x_api_key != "EXPECTED_API_KEY_PLACEHOLDER") {
            return 401 '{"error":"unauthorized","message":"Invalid or missing X-API-Key header"}';
        }

        proxy_pass            http://opensandbox-server:8080;
        proxy_connect_timeout 120s;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;

        # Pass the API key through so OpenSandbox can do its own validation
        proxy_set_header X-API-Key $http_x_api_key;
    }

    # ---------------------------------------------------------------------------
    # All other paths — 404
    # ---------------------------------------------------------------------------
    location / {
        return 404 '{"error":"not_found"}';
        add_header Content-Type application/json always;
    }
}

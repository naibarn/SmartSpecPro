# SmartSpec Pro - Media Processing Stack
# Isolated Celery workers for media generation (API) and video rendering (FFmpeg)
# Resource limits prevent FFmpeg from overloading the host machine.
#
# REQUIRES: Main stack running first (docker-compose.yml)
#   to provide: postgres, redis on smartspec-network network
#
# Usage:
#   docker compose -f docker-compose.media.yml up -d
#
# Monitor:
#   Flower dashboard: http://localhost:5555
#
# NOTE: Set NODE_BASE_URL=http://host.docker.internal:3000 in apps/web/.env
#   so asset URIs resolve correctly from inside Docker containers.

x-external-dns: &external-dns
  # Explicit public resolvers avoid Docker inheriting an empty upstream DNS set.
  dns:
    - 1.1.1.1
    - 8.8.8.8

services:
  # ============================================
  # CELERY MEDIA WORKER
  # Handles: generate_image_task, generate_video_task,
  #          generate_audio_task, cleanup, retry
  # These are API-bound (LLM/provider calls), light CPU
  # ============================================
  celery-media:
    <<: *external-dns
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: smartspec-celery-media
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=3 --max-tasks-per-child=20 --max-memory-per-child=700000 -Q media -n media@%h
    env_file:
      - ./python-backend/.env
    environment:
      # Override networking: use Docker hostnames instead of localhost
      - CELERY_BROKER_URL=redis://smartspec-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://smartspec-redis:6379/0
      - REDIS_URL=redis://smartspec-redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://smartspec:smartspec123@smartspec-postgres:5432/smartspec
      - MEDIA_STORAGE_PATH=/app/media_storage
      - OPENSANDBOX_BASE_URL=http://smartspec-opensandbox:8080
      - OPENSANDBOX_MEDIA_IMAGE=jrottenberg/ffmpeg:6-ubuntu
      - SMARTSPEC_WEB_GATEWAY_URL=http://host.docker.internal:3000
      - WEB_APP_URL=http://host.docker.internal:3000
      - SMARTSPEC_PLAYWRIGHT_ENABLED=false
      # API keys inherited from env_file
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./python-backend:/app
      - ./python-backend/media_storage:/app/media_storage
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -d media@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    networks:
      - smartspec-network
      - opensandbox-network

  # ============================================
  # CELERY VIDEO WORKER
  # Handles: execute_media_job (FFmpeg rendering)
  # These are CPU/IO-heavy (FFmpeg encode, probe, etc.)
  # Isolated so overload doesn't affect other services
  # Resource limits: 4 CPUs / 8GB RAM max
  # ============================================
  celery-video:
    <<: *external-dns
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: smartspec-celery-video
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=1 --max-tasks-per-child=10 --max-memory-per-child=3000000 -Q video -n video@%h
    env_file:
      - ./python-backend/.env
    environment:
      # Override networking: use Docker hostnames instead of localhost
      - CELERY_BROKER_URL=redis://smartspec-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://smartspec-redis:6379/0
      - REDIS_URL=redis://smartspec-redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://smartspec:smartspec123@smartspec-postgres:5432/smartspec
      - MEDIA_STORAGE_PATH=/app/media_storage
      - OPENSANDBOX_BASE_URL=http://smartspec-opensandbox:8080
      - OPENSANDBOX_MEDIA_IMAGE=jrottenberg/ffmpeg:6-ubuntu
      - SMARTSPEC_WEB_GATEWAY_URL=http://host.docker.internal:3000
      - WEB_APP_URL=http://host.docker.internal:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./python-backend:/app
      - ./python-backend/media_storage:/app/media_storage
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -d video@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    networks:
      - smartspec-network
      - opensandbox-network

  # ============================================
  # CELERY IMPORT WORKER
  # Handles: import_presentation_task (PPTX / Google Slides)
  # These are API-bound (S3 download, Google API), light CPU
  # ============================================
  celery-import:
    <<: *external-dns
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: smartspec-celery-import
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2 --max-tasks-per-child=20 --max-memory-per-child=700000 -Q presentation_import -n import@%h
    env_file:
      - ./python-backend/.env
    environment:
      # Override networking: use Docker hostnames instead of localhost
      - CELERY_BROKER_URL=redis://smartspec-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://smartspec-redis:6379/0
      - REDIS_URL=redis://smartspec-redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://smartspec:smartspec123@smartspec-postgres:5432/smartspec
      - NODE_INTERNAL_URL=http://host.docker.internal:3000
      - SMARTSPEC_WEB_GATEWAY_URL=http://host.docker.internal:3000
      - WEB_APP_URL=http://host.docker.internal:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./python-backend:/app
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -d import@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    networks:
      - smartspec-network

  # ============================================
  # CELERY PRESENTATION EXPORT WORKER
  # Handles: render_presentation (PNG/JPG/PDF/MP4 export)
  # Uses Playwright + FFmpeg + R2 upload; isolated for stability
  # ============================================
  celery-presentation:
    <<: *external-dns
    image: smartspecpro-celery-media
    container_name: smartspec-celery-presentation
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=1 --max-tasks-per-child=10 --max-memory-per-child=2500000 -Q presentation_export -n presentation@%h
    env_file:
      - ./python-backend/.env
    environment:
      - CELERY_BROKER_URL=redis://smartspec-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://smartspec-redis:6379/0
      - REDIS_URL=redis://smartspec-redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://smartspec:smartspec123@smartspec-postgres:5432/smartspec
      # Presentation renderer runs in Docker; use host gateway to reach web server
      - INTERNAL_RENDER_BASE_URL=http://host.docker.internal:3000
      - SMARTSPEC_WEB_GATEWAY_URL=http://host.docker.internal:3000
      - WEB_APP_URL=http://host.docker.internal:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./python-backend:/app
      - ./python-backend/media_storage:/app/media_storage
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 6G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -d presentation@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    networks:
      - smartspec-network

  # ============================================
  # CELERY SANDBOX WORKER
  # Handles: execute_sandbox_job (OpenSandbox orchestration)
  # Manages sandbox lifecycle: provision, execute, collect, destroy
  # Resource limits: 2 CPUs / 4GB RAM max
  # ============================================
  celery-sandbox:
    <<: *external-dns
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: smartspec-celery-sandbox
    group_add:
      - "${DOCKER_GID:-989}"
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=1 --max-tasks-per-child=10 --max-memory-per-child=1200000 -Q sandbox -n sandbox@%h
    env_file:
      - ./python-backend/.env
    environment:
      - CELERY_BROKER_URL=redis://smartspec-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://smartspec-redis:6379/0
      - REDIS_URL=redis://smartspec-redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://smartspec:smartspec123@smartspec-postgres:5432/smartspec
      - OPENSANDBOX_BASE_URL=http://smartspec-opensandbox:8080
      - SMARTSPEC_WEB_GATEWAY_URL=http://host.docker.internal:3000
      - WEB_APP_URL=http://host.docker.internal:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./python-backend:/app
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -d sandbox@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    networks:
      - smartspec-network
      - opensandbox-network

  # ============================================
  # CELERY BEAT (Periodic Task Scheduler)
  # Runs exactly once — schedules cleanup + retry tasks
  # ============================================
  celery-beat:
    <<: *external-dns
    image: smartspecpro-celery-media
    container_name: smartspec-celery-beat
    command: celery -A app.core.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    env_file:
      - ./python-backend/.env
    environment:
      - CELERY_BROKER_URL=redis://smartspec-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://smartspec-redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://smartspec:smartspec123@smartspec-postgres:5432/smartspec
      - SMARTSPEC_WEB_GATEWAY_URL=http://host.docker.internal:3000
      - WEB_APP_URL=http://host.docker.internal:3000
    volumes:
      - ./python-backend:/app
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    networks:
      - smartspec-network

  # ============================================
  # FLOWER (Celery Monitoring Dashboard)
  # Monitors both media and video queues
  # ============================================
  flower:
    <<: *external-dns
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: smartspec-flower
    command: celery --broker=redis://smartspec-redis:6379/0 flower --port=5555
    environment:
      - CELERY_BROKER_URL=redis://smartspec-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://smartspec-redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - celery-media
      - celery-video
      - celery-import
      - celery-presentation
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5555/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    networks:
      - smartspec-network

networks:
  smartspec-network:
    external: true
  opensandbox-network:
    external: true

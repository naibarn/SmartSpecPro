# SmartSpec Pro - Nginx Dev Config (host network mode)
# Used when services run on host via dev-local.sh / run-services.sh

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 2G;  # Support large video files (up to 2GB)

    # Proxy settings
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Upstreams point to host (network=host mode)
    upstream smartspec_web {
        server 127.0.0.1:3000;
    }

    upstream python_backend {
        server 127.0.0.1:8000;
    }

    # HTTPS
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name smartaihub.app localhost;

        ssl_certificate /etc/nginx/ssl/smartaihub.app.crt;
        ssl_certificate_key /etc/nginx/ssl/smartaihub.app.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        location /health {
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /nginx-health {
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Python backend API — routed through Express for session-cookie → JWT auth.
        # Express proxy at /api/v1/* validates session, generates JWT, forwards to Python.
        location /api/v1/ {
            proxy_pass http://smartspec_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # tRPC API
        location /trpc/ {
            proxy_pass http://smartspec_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 120s;
        }

        # Node.js API routes
        location /api/ {
            proxy_pass http://smartspec_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_request_buffering off;
        }

        # Main (web app + Vite HMR)
        location / {
            proxy_pass http://smartspec_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        listen [::]:80;
        server_name smartaihub.app localhost;
        return 301 https://$host$request_uri;
    }
}

# Development configuration - Proxy to host-based services
# Backend: localhost:8000 (Python FastAPI)
# Web: localhost:3000 (Node.js + React)

upstream backend_host {
    server host.docker.internal:8000;
}

upstream web_host {
    server host.docker.internal:3000;
}

upstream docker_status_host {
    server host.docker.internal:3001;
}

server {
    listen 80;
    listen [::]:80;
    server_name smartaihub.app localhost;

    # Allow large file uploads (video files) - increased for multipart overhead
    client_max_body_size 5G;
    client_body_timeout 600s;
    client_header_timeout 600s;

    # Health check
    location /health {
        return 200 "nginx healthy\n";
        add_header Content-Type text/plain;
    }

    # Media Jobs Upload (Node.js backend) - must come BEFORE /api/
    location /api/media-jobs/ {
        proxy_pass http://web_host;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for large file uploads
        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Disable buffering for uploads
        proxy_request_buffering off;
    }

    # Python Backend API
    location /api/ {
        proxy_pass http://backend_host;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for large file uploads
        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;  # 10 minutes
        proxy_read_timeout 600s;

        # Disable buffering for uploads
        proxy_request_buffering off;
    }

    # tRPC API
    location /trpc/ {
        proxy_pass http://web_host;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for tRPC streaming
        proxy_buffering off;
        proxy_cache off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # WebSocket support
    location /ws {
        proxy_pass http://web_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Main web app
    location / {
        proxy_pass http://web_host;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for large uploads
        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Disable buffering for uploads
        proxy_request_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name docker.smartaihub.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name smartaihub.app;

    ssl_certificate /etc/nginx/ssl/smartaihub.app.crt;
    ssl_certificate_key /etc/nginx/ssl/smartaihub.app.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Allow large file uploads (video files) - increased for multipart overhead
    client_max_body_size 5G;
    client_body_timeout 600s;
    client_header_timeout 600s;

    # Media Jobs Upload (Node.js backend) - must come BEFORE /api/
    location /api/media-jobs/ {
        proxy_pass http://web_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for large file uploads
        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Disable buffering for uploads
        proxy_request_buffering off;
    }

    location /api/ {
        proxy_pass http://backend_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for large file uploads
        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Disable buffering for uploads
        proxy_request_buffering off;
    }

    location /trpc/ {
        proxy_pass http://web_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://web_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Extended timeouts for large uploads
        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Disable buffering for uploads
        proxy_request_buffering off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name docker.smartaihub.app;

    ssl_certificate /etc/nginx/ssl/smartaihub.app.crt;
    ssl_certificate_key /etc/nginx/ssl/smartaihub.app.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /health {
        return 200 "docker-status nginx healthy\n";
        add_header Content-Type text/plain;
    }

    location /api/trpc/ {
        proxy_pass http://docker_status_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://docker_status_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name docker.smartaihub.app;

    ssl_certificate /etc/nginx/ssl/smartaihub.app.crt;
    ssl_certificate_key /etc/nginx/ssl/smartaihub.app.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /health {
        return 200 "docker-status nginx healthy\n";
        add_header Content-Type text/plain;
    }

    location /api/trpc/ {
        proxy_pass http://docker_status_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://docker_status_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# Development configuration - Proxy to host-based services
# Backend: localhost:8000 (Python FastAPI)
# Web: localhost:3000 (Node.js + React)

upstream backend_host {
    server host.docker.internal:8000;
}

upstream web_host {
    server host.docker.internal:3000;
}

upstream docker_status_host {
    server host.docker.internal:3001;
}

upstream glitchtip_host {
    server smartspec-glitchtip-web:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name smartaihub.app localhost;

    # Default body size limit (overridden for specific upload endpoints below)
    client_max_body_size 10M;
    client_body_timeout 600s;
    client_header_timeout 600s;

    # Rate limit error responses
    limit_req_status 429;
    limit_conn_status 429;

    # Health check
    location /health {
        return 200 "nginx healthy\n";
        add_header Content-Type text/plain;
    }

    # Media Jobs SSE events (must come BEFORE /api/media-jobs/)
    location ~ ^/api/media-jobs/[^/]+/events$ {
        proxy_pass http://web_host;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Critical for SSE
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Media Jobs (Node.js backend) - must come BEFORE /api/
    # Large file uploads allowed for media endpoints
    location /api/media-jobs/ {
        client_max_body_size 5G;  # Allow large video files (up to 5GB for multipart overhead)

        proxy_pass http://web_host;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for large file uploads
        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Disable buffering/caching for uploads and polling
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
    }

    # Storage proxy (Node.js) - streams files from R2/S3, must come BEFORE /api/
    location /api/storage/ {
        client_max_body_size 5G;  # Allow large file uploads/downloads

        proxy_pass http://web_host;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large file streaming - extended timeouts
        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Disable buffering for streaming
        proxy_buffering off;
    }

    # Desktop release uploads (Node.js) - must come BEFORE /api/
    location /api/desktop-releases/upload {
        client_max_body_size 1G;

        proxy_pass http://web_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for large uploads
        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Disable buffering for uploads
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Agency Stream SSE events (must come BEFORE /api/)
    location = /api/v1/agency/stream {
        proxy_pass http://web_host;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Critical for SSE
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        proxy_connect_timeout 120s;
        proxy_send_timeout 700s;
        proxy_read_timeout 700s;
    }

    # Voice WebSocket (section-06-voice) — must come BEFORE /api/
    location /api/voice/stream {
        proxy_pass http://web_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;  # 5-minute voice session max
        proxy_send_timeout 300s;
    }

    # Notification SSE stream (Node.js) - must come BEFORE /api/
    location = /api/notifications/stream {
        proxy_pass http://web_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Channel webhooks — must come BEFORE /api/ (Node.js handles these, not Python)
    # Handles: /webhooks/telegram/:connId, /webhooks/whatsapp/:connId, etc.
    location /webhooks/ {
        proxy_pass http://web_host;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Higher burst for platform webhook providers (Telegram, WhatsApp, LINE)
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 30;
    }

    # Inbound webhook triggers (Node.js, section-11) — must come BEFORE /api/
    # External services POST here; Python backend must NOT handle these.
    location /api/webhooks/trigger/ {
        proxy_pass http://web_host;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Higher burst for webhook providers sending events in parallel
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 30;
    }

    # MCP Streamable HTTP / SSE (must come BEFORE /api/)
    # proxy_buffering off required for Server-Sent Events
    # 1800s timeout needed for long-running MCP tool calls (LLM inference)
    location ~ ^/api/v1/mcp/ {
        proxy_pass http://backend_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 120s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;

        # Safety net: cap concurrent MCP connections per IP
        # Auth is at app layer; this prevents resource exhaustion if auth is bypassed
        limit_conn conn_limit 10;
    }

    # Python Backend API
    location /api/ {
        client_max_body_size 2G;  # Allow large uploads to Python backend
        proxy_pass http://backend_host;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for large file uploads
        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;  # 10 minutes
        proxy_read_timeout 600s;

        # Disable buffering for uploads
        proxy_request_buffering off;

        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 20;
    }

    # tRPC API
    location /trpc/ {
        client_max_body_size 50M;

        proxy_pass http://web_host;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for tRPC streaming
        proxy_buffering off;
        proxy_cache off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Rate limiting
        limit_req zone=api_limit burst=30 nodelay;
        limit_conn conn_limit 30;
    }

    # WebSocket support
    location /ws {
        proxy_pass http://web_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Widget WebSocket (long-lived sessions)
    location /widget/v1/ws {
        proxy_pass http://web_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }

    # Widget static assets and init endpoint
    location /widget/v1/ {
        proxy_pass http://web_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block external access to internal routes
    location /internal/ {
        deny all;
        return 403;
    }

    # Block external access to internal API routes (service-to-service only)
    location /api/internal/ {
        deny all;
        return 403;
    }

    # Block external access to VERSIONED internal API routes (e.g. /api/v1/internal/*).
    # The prefix rule above does not cover these; without this regex the /api/ catch-all
    # would proxy them to the Python backend and expose them publicly. They are
    # localhost/service-to-service only (e.g. internal_provider.py).
    location ~ ^/api/v[0-9]+/internal/ {
        deny all;
        return 403;
    }

    # Main web app
    location / {
        client_max_body_size 100M;  # Allow moderate file uploads in web app

        proxy_pass http://web_host;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for large uploads
        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Disable buffering for uploads
        proxy_request_buffering off;

        # Rate limiting
        limit_req zone=web_limit burst=40 nodelay;
        limit_conn conn_limit 50;
    }
}


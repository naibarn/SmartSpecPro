# SmartSpec Pro - Development Server Configuration
# HTTP server with relaxed rate limits for development

server {
    listen 80;
    listen [::]:80;
    server_name localhost smartspec.local;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check endpoint
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ============================================
    # SmartSpec Web Application (Main)
    # ============================================
    location / {
        # Relaxed rate limits for development
        limit_req zone=web_limit burst=100 nodelay;
        limit_conn conn_limit 50;

        proxy_pass http://smartspec_web;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # NO CACHING IN DEVELOPMENT - Force fresh files every time
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://smartspec_web;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }
    }

    # ============================================
    # Python Backend API
    # ============================================
    location /api/ {
        # Relaxed rate limits for development
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 30;

        # Remove /api prefix when forwarding
        rewrite ^/api/(.*) /$1 break;

        proxy_pass http://python_backend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running API calls (LLM)
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Disable buffering for streaming responses
        proxy_buffering off;
        proxy_cache off;
    }

    # Python Backend health check (no rate limit)
    location /api/health {
        proxy_pass http://python_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ============================================
    # Control Plane
    # ============================================
    location /control/ {
        # Relaxed rate limits for development
        limit_req zone=api_limit burst=30 nodelay;

        # Remove /control prefix when forwarding
        rewrite ^/control/(.*) /$1 break;

        proxy_pass http://control_plane;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # tRPC endpoints (SmartSpec Web)
    # ============================================
    location /trpc/ {
        # NO rate limits for tRPC in development - makes many parallel batch calls
        # Re-enable for production: limit_req zone=api_limit burst=100 nodelay;

        proxy_pass http://smartspec_web;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for subscriptions
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# Request logging with upstream timing + real client IP recovery.
# Loaded before dev-host.conf (alphabetical include order) so main_timed
# exists before any access_log directive references it.

# Adds timing fields the default 'main' format lacks:
#   rt  = $request_time            (total time nginx spent on the request)
#   urt = $upstream_response_time  (time waiting on the upstream service)
#   us  = $upstream_status         (status the upstream actually returned)
#   ua  = $upstream_addr           (which upstream handled it)
log_format main_timed '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time urt="$upstream_response_time" '
                      'us="$upstream_status" ua="$upstream_addr"';

# Public traffic arrives via cloudflared -> docker-proxy, so the TCP peer
# inside the container is always the docker gateway (172.18.0.1). Recover
# the real client IP from Cloudflare's header so the $binary_remote_addr
# rate-limit zones (00-rate-limits.conf) stay per-client instead of
# collapsing all tunnel traffic into one bucket, and so access logs show
# the actual visitor. Requests without the header (local curl) keep the
# gateway address.
set_real_ip_from 172.18.0.0/16;
real_ip_header CF-Connecting-IP;

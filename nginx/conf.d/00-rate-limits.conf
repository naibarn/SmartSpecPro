# Rate limiting zone definitions (must be in http context, before server blocks)
# Loaded before dev-host.conf due to alphabetical include order.

# API endpoints: 10 requests/second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Web/frontend: 20 requests/second per IP
limit_req_zone $binary_remote_addr zone=web_limit:10m rate=20r/s;

# Connection limit: max concurrent connections per IP
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

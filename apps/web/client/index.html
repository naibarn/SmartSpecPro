<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>SmartSpec Pro - AI-Powered Code Generation Platform</title>
    <meta name="description" content="Transform your ideas into production-ready SaaS applications with SmartSpec Pro. AI-powered code generation, multi-modal content creation, and enterprise-grade security." />
    <meta name="keywords" content="AI code generation, SaaS builder, code automation, SmartSpec, AI development, no-code, low-code" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="SmartSpec Pro - AI-Powered Code Generation" />
    <meta property="og:description" content="Transform your ideas into production-ready applications with AI" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/og-image.png" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SmartSpec Pro" />
    <meta name="twitter:description" content="AI-Powered Code Generation Platform" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Enhanced script to remove all preview/staging mode banners
      function removePreviewBanners() {
        function isAppElement(el) {
          return !!(
            el.closest('#root') ||
            el.closest('[data-radix-portal]') ||
            el.closest('[role="dialog"]')
          );
        }

        // Remove by ID patterns
        const idPatterns = ['manus', 'previewer', 'preview', 'staging', 'banner'];
        document.querySelectorAll('[id]').forEach(function(el) {
          if (isAppElement(el)) return;
          const id = el.id.toLowerCase();
          if (idPatterns.some(p => id.includes(p))) {
            el.remove();
          }
        });

        // Remove by text content - search all elements
        const bannerTexts = [
          'Preview mode',
          'This page is not live',
          'cannot be shared directly',
          'Please publish to get a public link',
          'publish to get',
          'not live'
        ];

        document.querySelectorAll('*').forEach(function(el) {
          if (isAppElement(el)) return;
          // Skip script/style/meta elements
          if (['SCRIPT', 'STYLE', 'META', 'LINK', 'TITLE'].includes(el.tagName)) return;

          const text = el.textContent || '';
          const directText = el.childNodes.length === 1 && el.childNodes[0].nodeType === 3
            ? el.childNodes[0].textContent : '';

          // Check if element contains banner text
          if (bannerTexts.some(t => text.includes(t) || directText.includes(t))) {
            const style = window.getComputedStyle(el);
            // Remove if it's positioned (fixed, absolute, sticky) or has high z-index
            if (style.position === 'fixed' ||
                style.position === 'absolute' ||
                style.position === 'sticky' ||
                parseInt(style.zIndex) > 1000) {
              el.remove();
              return;
            }
            // Also remove if it's a direct child of body and small
            if (el.parentElement === document.body && el.offsetHeight < 100) {
              el.remove();
              return;
            }
            // Remove parent if this is inside a small container
            let parent = el.parentElement;
            while (parent && parent !== document.body) {
              const ps = window.getComputedStyle(parent);
              if (ps.position === 'fixed' || ps.position === 'absolute' || parseInt(ps.zIndex) > 1000) {
                parent.remove();
                return;
              }
              parent = parent.parentElement;
            }
          }
        });

        // Remove by data attributes
        document.querySelectorAll('[data-loc*="Previewer"], [data-loc*="preview"], [data-preview-mode], [data-testid*="preview"], [data-testid*="banner"]').forEach(function(el) {
          if (isAppElement(el)) return;
          el.remove();
        });

        // Remove by class patterns
        document.querySelectorAll('[class*="preview"], [class*="Preview"], [class*="banner"], [class*="Banner"], [class*="manus"], [class*="Manus"]').forEach(function(el) {
          if (isAppElement(el)) return;
          el.remove();
        });

        // Remove fixed elements at bottom of screen (common for preview banners)
        document.querySelectorAll('body > div, body > aside, body > section').forEach(function(el) {
          if (el.id === 'root' || isAppElement(el)) return;
          const style = window.getComputedStyle(el);
          if (style.position === 'fixed' &&
              (style.bottom === '0px' || parseInt(style.bottom) < 50) &&
              el.offsetHeight < 100) {
            el.remove();
          }
        });
      }

      // Run immediately
      removePreviewBanners();

      // Run after DOM loads
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', removePreviewBanners);
      } else {
        removePreviewBanners();
      }

      // Watch for new injected banners with MutationObserver
      const observer = new MutationObserver(function(mutations) {
        removePreviewBanners();
      });

      // Start observing when body is available
      if (document.body) {
        observer.observe(document.body, {childList: true, subtree: true});
      } else {
        document.addEventListener('DOMContentLoaded', function() {
          observer.observe(document.body, {childList: true, subtree: true});
        });
      }

      // Run periodically for first 10 seconds (more aggressive)
      let runCount = 0;
      const intervalId = setInterval(function() {
        removePreviewBanners();
        runCount++;
        if (runCount >= 20) clearInterval(intervalId);
      }, 500);
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Analytics disabled: Uncomment and set VITE_ANALYTICS_ENDPOINT and VITE_ANALYTICS_WEBSITE_ID in .env to enable
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
    -->
  </body>
</html>

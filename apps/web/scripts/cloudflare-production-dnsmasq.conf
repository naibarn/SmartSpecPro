# Private resolver for the existing Cloudflare Tunnel's process namespace.
# No host-wide resolv.conf change and no public listener or DHCP service.
listen-address=127.0.0.1
bind-interfaces
no-hosts
host-record=db.smartaihub.app,127.0.0.1
local=/db.smartaihub.app/
host-record=db-staging.smartaihub.app,127.0.0.1
local=/db-staging.smartaihub.app/
local-ttl=30
cache-size=64

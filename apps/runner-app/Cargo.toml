[package]
name = "smartaihub-runner"
version = "0.1.0"
description = "Headless SmartAIHub Runner for local devices and shared containers"
authors = ["SmartAIHub"]
edition = "2021"

[[bin]]
name = "smartaihub-runner"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
rsa = { version = "0.9", features = ["sha2"] }
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
ureq = { version = "3.4", features = ["json"] }

[dev-dependencies]
tempfile = "3"

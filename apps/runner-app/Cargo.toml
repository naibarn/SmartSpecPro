[package]
name = "smartaihub-runner"
version = "0.1.0"
description = "Headless SmartAIHub Runner for local devices and shared containers"
authors = ["SmartAIHub"]
edition = "2021"

[features]
default = []
spec208-moli-acceptance = []

[[bin]]
name = "smartaihub-runner"
path = "src/main.rs"

[[bin]]
name = "smartaihub-session-host"
path = "src/session_host_main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
fs2 = "0.4"
github-copilot-sdk = { version = "=1.0.28", default-features = false, features = ["runtime"] }
libc = "0.2"
rsa = { version = "0.9", features = ["sha2"] }
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
ureq = { version = "3.4", features = ["json"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]

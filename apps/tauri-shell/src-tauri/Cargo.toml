[package]
name = "smartspec-tauri-shell"
version = "0.1.0"
description = "SmartSpec Pro Desktop Shell"
authors = ["SmartSpec"]
edition = "2021"

[lib]
name = "smartspec_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "process", "io-util", "sync", "macros", "fs"] }
portable-pty = "0.8"
anyhow = "1"
async-recursion = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
regex = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
base64 = "0.22"
ring = "0.17.14"
time = { version = "0.3", features = ["formatting"] }

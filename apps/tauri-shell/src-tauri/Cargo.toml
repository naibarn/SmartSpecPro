[package]
name = "smartspec-tauri-shell"
version = "0.1.0"
description = "SmartSpec Pro Desktop Shell"
authors = ["SmartSpec"]
edition = "2021"

[lib]
name = "smartspec_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

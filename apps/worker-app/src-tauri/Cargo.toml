[package]
name = "smart-ai-hub-worker-app"
version = "0.1.0"
description = "Smart AI Hub Worker App"
authors = ["SmartAIHub"]
edition = "2021"

[lib]
name = "smart_ai_hub_worker_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }

[dependencies]
tauri = { version = "=2.10.3", features = [] }
tauri-plugin-opener = "=2.5.3"
tauri-runtime = "=2.10.1"
tauri-runtime-wry = "=2.10.1"
tauri-utils = "=2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"

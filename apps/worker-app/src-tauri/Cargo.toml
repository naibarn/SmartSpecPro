[package]
name = "smart-ai-hub-worker-app"
version = "0.1.297"
description = "Smart AI Hub Worker App"
authors = ["SmartAIHub"]
edition = "2021"

[lib]
name = "smart_ai_hub_worker_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }

[dependencies]
tauri = { version = "=2.10.3", features = ["protocol-asset"] }
tauri-plugin-opener = "=2.5.3"
tauri-runtime = "=2.10.1"
tauri-runtime-wry = "=2.10.1"
tauri-utils = "=2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["oid"] }
hmac = "0.12"
time = { version = "0.3", features = ["formatting", "parsing"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "query", "rustls", "stream"] }
base64 = "0.22"
urlencoding = "2"
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt", "sync", "time", "process", "io-util", "fs"] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
tauri-plugin-single-instance = "2.4.3"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }

[dev-dependencies]
tempfile = "3"

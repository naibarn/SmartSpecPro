<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 1024" role="img" aria-labelledby="title desc">
  <title id="title">SmartAIHub public home tablet reference</title>
  <desc id="desc">Stacked outcome hero and product flow, followed by Vertical Series and two-column discovery.</desc>
  <rect width="768" height="1024" fill="#f7fbff"/><rect x="24" y="20" width="720" height="64" rx="22" fill="#fff" stroke="#d7e5f1"/>
  <circle cx="60" cy="52" r="20" fill="#05b6dc"/><text x="94" y="60" font-family="sans-serif" font-size="23" font-weight="700" fill="#007eaa">SmartAIHub</text><text x="490" y="58" font-family="sans-serif" font-size="14" fill="#496274">Features　Pricing　Docs</text>
  <text x="40" y="136" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#0089c7">A CONNECTED WORKSPACE</text><text x="40" y="193" font-family="sans-serif" font-size="39" font-weight="700" fill="#153b4b">Turn one idea into work</text><text x="40" y="238" font-family="sans-serif" font-size="39" font-weight="700" fill="#153b4b">you can keep building</text>
  <text x="40" y="278" font-family="sans-serif" font-size="16" fill="#496274">Explore chat, media, and Vertical Series workspaces.</text><rect x="40" y="302" width="158" height="44" rx="22" fill="#00a8e0"/><text x="62" y="330" font-family="sans-serif" font-size="15" fill="white">Create account</text><rect x="210" y="302" width="166" height="44" rx="22" fill="white" stroke="#b9d3e4"/><text x="235" y="330" font-family="sans-serif" font-size="15" fill="#315264">Explore features</text>
  <rect x="40" y="374" width="688" height="226" rx="24" fill="white" stroke="#c9deed"/><text x="70" y="415" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#0089c7">ONE IDEA, A CONNECTED PATH</text><text x="70" y="449" font-family="sans-serif" font-size="21" font-weight="700" fill="#153b4b">Choose how to move it forward</text>
  <rect x="70" y="470" width="285" height="78" rx="14" fill="#f1f7fb"/><text x="90" y="497" font-family="sans-serif" font-size="12" fill="#547080">START WITH</text><text x="90" y="527" font-family="sans-serif" font-size="16" fill="#153b4b">The work you have in mind</text><rect x="375" y="470" width="323" height="78" rx="14" fill="#f1f7fb"/><text x="395" y="497" font-family="sans-serif" font-size="12" fill="#547080">CONTINUE IN</text><text x="395" y="527" font-family="sans-serif" font-size="16" fill="#153b4b">Chat, media, or a series</text><text x="70" y="578" font-family="sans-serif" font-size="13" fill="#496274">Concept illustration, not a product screenshot or customer work.</text>
  <rect x="40" y="624" width="688" height="166" rx="24" fill="#eaf7ff"/><text x="70" y="666" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#0089c7">FLAGSHIP WORKSPACE</text><text x="70" y="708" font-family="sans-serif" font-size="28" font-weight="700" fill="#153b4b">Vertical Series</text><text x="70" y="742" font-family="sans-serif" font-size="15" fill="#496274">A supported signed-in destination for staged creative work.</text><rect x="70" y="756" width="160" height="42" rx="21" fill="#00a8e0"/><text x="92" y="783" font-family="sans-serif" font-size="14" fill="white">Explore series</text>
  <text x="40" y="840" font-family="sans-serif" font-size="24" font-weight="700" fill="#153b4b">Choose a place to begin</text><rect x="40" y="864" width="328" height="64" rx="16" fill="white" stroke="#d7e5f1"/><rect x="400" y="864" width="328" height="64" rx="16" fill="white" stroke="#d7e5f1"/><text x="64" y="904" font-family="sans-serif" font-size="16" font-weight="700" fill="#153b4b">Features　→</text><text x="424" y="904" font-family="sans-serif" font-size="16" font-weight="700" fill="#153b4b">Documentation　→</text>
</svg>

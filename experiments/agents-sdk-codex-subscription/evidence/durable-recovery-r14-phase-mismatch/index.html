<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f1">
  <title>SplitFair — split a bill fairly</title>
  <style>
    :root { color-scheme: light; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #18231e; background: #f6f5f1; font-synthesis: none; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 18px; }
    main { width: min(100%, 480px); }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; font-weight: 750; letter-spacing: -.03em; font-size: 18px; }
    .mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; color: white; background: #287653; font-size: 18px; }
    .card { background: white; border: 1px solid #e7e9e4; border-radius: 22px; padding: clamp(24px, 6vw, 38px); box-shadow: 0 18px 55px #26372b0b; }
    .eyebrow { color: #287653; text-transform: uppercase; letter-spacing: .12em; font-size: 11px; font-weight: 750; margin: 0 0 9px; }
    h1 { font-size: clamp(29px, 7vw, 38px); letter-spacing: -.05em; line-height: 1.08; margin: 0; }
    .intro { color: #68736c; font-size: 15px; line-height: 1.55; margin: 12px 0 28px; }
    form { display: grid; gap: 19px; }
    label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; }
    .input-wrap { display: flex; align-items: center; border: 1px solid #dce1dc; border-radius: 12px; background: #fff; transition: border-color .15s, box-shadow .15s; }
    .input-wrap:focus-within { border-color: #287653; box-shadow: 0 0 0 3px #2876531b; }
    .prefix { color: #79837c; padding-left: 15px; font-size: 16px; }
    input { width: 100%; height: 50px; border: 0; outline: 0; background: transparent; padding: 0 14px; font: inherit; color: inherit; font-size: 16px; }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { appearance: textfield; }
    .hint { color: #828b85; font-size: 12px; margin: 7px 0 0; }
    .actions { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 5px; }
    button { min-height: 49px; border: 0; border-radius: 12px; font: inherit; font-weight: 700; cursor: pointer; transition: transform .12s, background .12s; }
    button:active { transform: translateY(1px); }
    .submit { color: white; background: #287653; padding: 0 20px; }
    .submit:hover { background: #216748; }
    .reset { padding: 0 16px; color: #536057; background: #f0f2ee; }
    .reset:hover { background: #e8ebe6; }
    button:focus-visible { outline: 3px solid #8dbca4; outline-offset: 2px; }
    .error { color: #a33e32; background: #fff3f0; border: 1px solid #f4d5cf; border-radius: 10px; padding: 11px 13px; font-size: 13px; margin: 0; }
    [hidden] { display: none !important; }
    .results { margin-top: 26px; border-top: 1px solid #e9ece8; padding-top: 22px; }
    .results-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
    h2 { font-size: 17px; letter-spacing: -.02em; margin: 0; }
    .total { font-size: 13px; color: #68736c; }
    .share-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; max-height: 310px; overflow: auto; }
    .share-list li { display: flex; justify-content: space-between; align-items: center; background: #f7f8f5; border-radius: 9px; padding: 11px 13px; font-size: 14px; }
    .share-list strong { font-size: 15px; font-variant-numeric: tabular-nums; }
    footer { color: #879089; text-align: center; font-size: 12px; margin-top: 20px; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true">÷</span><span>SplitFair</span></div>
    <section class="card" aria-labelledby="title">
      <p class="eyebrow">A fair share, every time</p>
      <h1 id="title">Split the bill.<br>Keep it simple.</h1>
      <p class="intro">Divide a total between your group. Any leftover cents are shared one by one, so every cent is accounted for.</p>
      <form id="split-form" novalidate>
        <div>
          <label for="bill">Bill total</label>
          <div class="input-wrap"><span class="prefix" aria-hidden="true">$</span><input id="bill" name="bill" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00" aria-label="Bill total in dollars" aria-describedby="bill-hint"></div>
          <p class="hint" id="bill-hint">Enter an amount greater than $0.00</p>
        </div>
        <div>
          <label for="people">Number of people</label>
          <div class="input-wrap"><input id="people" name="people" type="number" inputmode="numeric" min="1" max="1000" step="1" placeholder="e.g. 4" value="2" aria-describedby="people-hint"></div>
          <p class="hint" id="people-hint">Whole numbers from 1 to 1,000</p>
        </div>
        <p class="error" id="error" role="alert" hidden></p>
        <div class="actions"><button class="submit" type="submit">Split bill</button><button class="reset" id="reset" type="button">Reset</button></div>
      </form>
      <section class="results" id="results" aria-labelledby="results-title" aria-live="polite" hidden>
        <div class="results-head"><h2 id="results-title">Each person pays</h2><span class="total" id="total"></span></div>
        <ul class="share-list" id="share-list"></ul>
      </section>
    </section>
    <footer>Every cent accounted for.</footer>
  </main>
  <script type="module" src="./app.mjs"></script>
</body>
</html>

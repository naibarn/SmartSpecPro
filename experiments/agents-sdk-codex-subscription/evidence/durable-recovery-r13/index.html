<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2ec">
  <title>SplitFair — a fair bill split</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="SplitFair home"><span class="brand-mark" aria-hidden="true">S</span> splitfair</a>
      <span class="offline-pill"><span aria-hidden="true"></span> Works offline</span>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">GOOD COMPANY. FAIR SHARE.</p>
      <h1 id="page-title">Make the split<br><em>feel simple.</em></h1>
      <p class="lede">No awkward math at the table. Just a fair share for everyone.</p>
    </section>

    <section class="calculator card" aria-label="Bill split calculator">
      <form id="split-form" novalidate>
        <div class="field">
          <label for="bill-total">Bill total <span class="required">*</span></label>
          <div class="input-wrap amount-wrap"><span class="currency" aria-hidden="true">$</span><input id="bill-total" name="billTotal" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" aria-label="Bill total in dollars" aria-describedby="bill-error" required></div>
          <p class="field-error" id="bill-error" aria-live="polite"></p>
        </div>
        <div class="field people-field">
          <label for="people-count">Number of people <span class="required">*</span></label>
          <div class="input-wrap people-wrap"><input id="people-count" name="people" type="number" min="1" max="1000" step="1" inputmode="numeric" placeholder="e.g. 4" aria-describedby="people-error" required><span class="people-suffix">people</span></div>
          <p class="field-error" id="people-error" aria-live="polite"></p>
        </div>
        <button class="primary-button" type="submit">Split the bill <span aria-hidden="true">↗</span></button>
      </form>
      <div class="note"><span aria-hidden="true">✳</span> The extra cent goes to the first few people.</div>
    </section>

    <section id="results" class="results card" aria-labelledby="results-title" aria-live="polite" hidden>
      <div class="results-heading"><div><p class="eyebrow">ALL SET</p><h2 id="results-title">Here’s the split.</h2></div><button id="reset-button" class="reset-button" type="button">Reset <span aria-hidden="true">↺</span></button></div>
      <p class="results-summary" id="results-summary"></p>
      <ul id="share-list" class="share-list" aria-label="Per-person amounts"></ul>
      <div class="total-row"><span>Total collected</span><strong id="share-total"></strong></div>
    </section>
    <footer><span>Split fairly, stay friends.</span><span>© SplitFair</span></footer>
  </main>
</body>
</html>

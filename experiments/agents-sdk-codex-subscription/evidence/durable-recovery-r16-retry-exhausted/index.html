<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SplitFair</title><style>body{font:16px system-ui,sans-serif;background:#f3f6f2;color:#17251f;margin:0;padding:24px}main{max-width:520px;margin:4vh auto;background:white;padding:32px;border-radius:18px}form,.field{display:grid;gap:10px}.field{margin:16px 0}input,button{font:inherit;padding:12px;border-radius:8px}input{border:1px solid #cad6cd}button{cursor:pointer;border:0}button[type=submit]{background:#236747;color:white}.actions{display:flex;gap:10px}.actions button[type=submit]{flex:1}#message{color:#a23c30;min-height:1.3em}#results[hidden]{display:none}#shares{padding:0;list-style:none}#shares li{display:flex;justify-content:space-between;padding:8px;background:#f4f7f4;margin:6px 0}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.tests{border-top:1px solid #ddd;margin-top:24px;padding-top:16px}</style></head><body><main><p>SplitFair</p><h1>Split the bill, fairly.</h1><p>Share every cent across your group.</p><form id="split-form" novalidate><div class="field"><label for="amount">Bill total<span class="visually-hidden"> in dollars</span></label><input id="amount" type="text" inputmode="decimal" aria-label="Bill total in dollars" placeholder="e.g. 10.01"></div><div class="field"><label for="people">Number of people</label><input id="people" type="text" inputmode="numeric" value="2"></div><div class="actions"><button type="submit">Submit</button><button type="reset">Reset</button></div><p id="message" role="alert"></p><section id="results" aria-live="polite" hidden><h2>Each person pays</h2><ul id="shares"></ul><p id="total"></p></section></form><section class="tests"><h2>Share allocation tests</h2><ul><li>1001 cents split three ways: 334, 334, 333 cents</li><li>Even totals give equal whole-cent shares</li><li>Shares sum exactly to the bill total</li></ul></section></main><script type="module">import{allocateShares}from'./split.mjs';const form=document.querySelector('#split-form'),amount=document.querySelector('#amount'),peopleInput=document.querySelector('#people'),message=document.querySelector('#message'),results=document.querySelector('#results'),list=document.querySelector('#shares'),totalOutput=document.querySelector('#total');function digits(s,min,max){return s.length>=min&&s.length<=max&&Array.from(s).every(c=>c>='0'&&c<='9')}form.addEventListener('submit',e=>{e.preventDefault();message.textContent='';results.hidden=true;list.replaceChildren();const a=amount.value.trim(),p=peopleInput.value.trim(),parts=a.split('.');if(parts.length>2||!digits(parts[0],1,15)||(parts.length===2&&!digits(parts[1],1,2))){message.textContent='Enter a valid bill total with no more than two decimal places.';amount.focus();return}const cents=Number(parts[0])*100+Number((parts[1]||'').padEnd(2,'0'));if(!Number.isSafeInteger(cents)||cents<1){message.textContent='Bill total must be at least $0.01.';amount.focus();return}if(!digits(p,1,4)||Number(p)<1||Number(p)>1000){message.textContent='Enter a whole number of people from 1 to 1,000.';peopleInput.focus();return}const shares=allocateShares(cents,Number(p));shares.forEach((share,i)=>{const row=document.createElement('li');row.textContent='Person '+(i+1)+': '+share+' cents';list.append(row)});totalOutput.textContent='Total '+cents+' cents';results.hidden=false});form.addEventListener('reset',()=>{message.textContent='';list.replaceChildren();totalOutput.textContent='';results.hidden=true});</script></body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SplitFair — a fair bill split</title>
  <style>
    :root { color-scheme: light; --ink: #202b27; --muted: #68736e; --green: #24634f; --line: #e0e5dd; --paper: #fffefa; }
    * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; background: #f6f3ec; color: var(--ink); font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    main { width: min(100% - 32px, 720px); margin: 0 auto; padding: 54px 0 64px; } .brand { color: var(--green); font-size: .78rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 10px 0 8px; font-size: clamp(2.25rem, 7vw, 4rem); line-height: 1.04; letter-spacing: -.055em; } .intro { max-width: 42ch; margin: 0 0 32px; color: var(--muted); }
    .card { background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: clamp(20px, 5vw, 34px); box-shadow: 0 14px 38px #263b3010; } .fields { display: grid; grid-template-columns: 1.25fr 1fr; gap: 18px; }
    label { display: block; margin: 0 0 8px; font-size: .9rem; font-weight: 700; } input { width: 100%; min-height: 52px; padding: 12px 14px; border: 1px solid #cbd4cc; border-radius: 10px; background: #fff; color: var(--ink); font: inherit; }
    input:focus { outline: 3px solid #92c7ae; outline-offset: 2px; border-color: var(--green); } .hint { margin: 7px 0 0; color: var(--muted); font-size: .8rem; } .actions { display: flex; gap: 12px; margin-top: 24px; }
    button { min-height: 48px; padding: 0 21px; border: 0; border-radius: 10px; font: inherit; font-weight: 750; cursor: pointer; } button:focus-visible { outline: 3px solid #92c7ae; outline-offset: 3px; }
    .primary { background: var(--green); color: white; } .primary:hover { background: #194d3d; } .secondary { background: #edf0ea; color: var(--ink); } .secondary:hover { background: #e2e8df; }
    .error { margin: 18px 0 0; padding: 11px 13px; border-radius: 8px; background: #fff0ed; color: #9a3326; } [hidden] { display: none !important; } .results { margin-top: 26px; padding-top: 24px; border-top: 1px solid var(--line); }
    .results h2 { margin: 0; font-size: 1.3rem; } .summary { margin: 4px 0 16px; color: var(--muted); } .shares { display: grid; grid-template-columns: repeat(auto-fit, minmax(138px, 1fr)); gap: 10px; padding: 0; margin: 0; list-style: none; }
    .shares li { display: flex; justify-content: space-between; gap: 10px; padding: 13px; background: #f3f6f0; border-radius: 9px; } .shares strong { color: var(--green); font-variant-numeric: tabular-nums; } .tests { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
    .tests summary { color: var(--muted); font-size: .85rem; font-weight: 700; cursor: pointer; } .test-status { margin: 12px 0 0; color: var(--green); font-size: .85rem; } @media (max-width: 520px) { main { padding-top: 34px; } .fields { grid-template-columns: 1fr; gap: 16px; } .actions { display: grid; grid-template-columns: 1fr 1fr; } }
  </style>
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <main>
    <div class="brand">SplitFair · Mini App</div><h1>Make the split fair.</h1>
    <p class="intro">Enter the bill and your group size. We’ll share every cent, so the total always adds up.</p>
    <section class="card" aria-label="Bill splitter">
      <form id="split-form" novalidate>
        <div class="fields">
          <div><label for="total">Bill total</label><input id="total" name="total" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00" aria-label="Bill total in dollars" aria-describedby="total-hint" required><p class="hint" id="total-hint">Enter an amount greater than $0.</p></div>
          <div><label for="people">Number of people</label><input id="people" name="people" type="number" inputmode="numeric" min="1" max="1000" step="1" placeholder="2" required><p class="hint">Whole numbers from 1 to 1,000.</p></div>
        </div>
        <div class="actions"><button class="primary" type="submit">Split the bill</button><button class="secondary" type="reset">Reset</button></div>
        <p id="error" class="error" role="alert" hidden></p>
      </form>
      <section id="results" class="results" aria-live="polite" aria-label="Split results" hidden><h2>Your split</h2><p id="summary" class="summary"></p><ul id="shares" class="shares"></ul></section>
      <details class="tests"><summary>Visible tests</summary><p id="test-status" class="test-status">Run the local visible tests from split.test.mjs.</p></details>
    </section>
  </main>
</body>
</html>
